name: Tests

# Schema validation, rendering and the citation-matching rules, on every push.
# Deliberately offline: no API keys, no network. The tests build from
# tests/fixtures/, so they do not depend on the state of curation/records/.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests
        run: make test
