# Recall list: records a complete catalog must contain, written down BEFORE
# looking at what the research tracks found, so "did it find the obvious
# things?" is a number rather than an impression. `make check` reports how many
# are present; a missing one is printed, not a failure.
#
# Each entry is a record id, or a mapping with an id and a reason:
#   - emptydrops
#   - {id: cellbender, why: default ambient + cell-calling step in many pipelines}
