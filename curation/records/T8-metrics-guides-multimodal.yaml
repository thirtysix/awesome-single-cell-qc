# ---------------------------------------------------------------- scATAC and multiome
- id: atac-qc-metrics
  name: scATAC per-cell QC metrics (TSS enrichment, fragments, FRiP, nucleosome signal, blacklist fraction)
  kind: method
  layer: core
  categories: [qc-metrics-thresholds, multimodal]
  side: both
  tier: standard
  summary: Filters scATAC and multiome barcodes on unique fragment count, TSS enrichment, fraction of fragments in peaks,
    nucleosome signal and blacklist fraction, the ATAC equivalents of counts, complexity and mito fraction
  recovers: cells whose low fragment counts are biology (small or quiescent nuclei) when TSS enrichment is still high
  gain: none measured as cells retained; the metrics are the basis of ArchR, Signac, SnapATAC2 and Cell Ranger ARC QC
  gain_source: none
  requires: [bam]
  caveats: Thresholds are fixed by convention (ArchR default TSS enrichment >= 4 and >= 1,000 fragments) and vary by
    protocol, since TSS enrichment and FRiP differ systematically between scATAC methods ([[de-rop-2024]]); FRiP needs a
    peak set, which genome-bin pipelines do not build ([[chromap-qc]]).
  url: https://stuartlab.org/signac/articles/pbmc_vignette
  doi: 10.1038/s41592-021-01282-5
