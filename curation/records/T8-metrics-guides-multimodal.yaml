- id: archr
  name: ArchR
  kind: tool
  layer: core
  categories: [qc-metrics-thresholds, multimodal, doublets]
  side: both
  tier: standard
  summary: R suite for scATAC analysis whose arrow-file creation step computes per-cell TSS enrichment and fragment counts,
    applies QC thresholds, and scores doublets by projecting synthetic doublets, before clustering and integration
  recovers: none specific; standard QC entry point for scATAC
  gain: 'analysed over 1.2 million cells in 8 h on a laptop (self-reported); Luo 2024: with SnapATAC2 the most scalable of
    five feature-engineering methods, but its iterative LSI embedding stayed correlated 0.5-0.75 with library size'
  gain_source: independent
  requires: [bam]
  caveats: Default thresholds (TSS enrichment >= 4, >= 1,000 fragments) are protocol-dependent; its doublet scores are an
    RNA-free method distinct from AMULET; last code push February 2025. Doublet scoring is simulation-based and heterotypic only;
    on simulated PBMC multiplets recall was 0.25 and 0.23 against 0.80 and 0.90 for AMULET, though ArchR was higher (0.68 vs
    0.37) on one low-depth islet sample (AMULET paper, a competitor comparison).
  url: https://www.archrproject.com
  repo: GreenleafLab/ArchR
  language: R
  doi: 10.1038/s41588-021-00790-6
  pmid: '33633365'
  cite_title: ArchR is a scalable software package for integrative single-cell chromatin accessibility analysis
  year: 2021
  verified: true
  benchmarks: [luo-2024-chromatin-benchmark]
  track: QC-sweep-C
  review: 13-metrics-guides-multimodal#archr
  tags: [atac, multiome, doublets]
- id: signac
  name: Signac
  kind: tool
  layer: core
  categories: [qc-metrics-thresholds, multimodal]
