# ---------------------------------------------------------------- CITE-seq / ADT
- id: adtnorm
  name: ADTnorm
  kind: tool
  layer: core
  categories: [batch-and-plate-effects, multimodal, normalisation]
  side: additive
  tier: published-unbenchmarked
  summary: Normalises antibody-derived tag counts by aligning the negative and positive peaks of each marker across samples
    and studies, with utilities for threshold gating and for scoring antibody staining quality
  recovers: protein markers that batch-specific staining makes unusable across samples, and titration guidance from the
    staining-quality score
  gain: against 14 scaling, normalisation and batch-correction methods (CLR, Arcsinh, logCPM, Harmony, fastMNN, CytofRUV,
    dsb, DecontPro, totalVI, sciPENN) on 13 public CITE-seq datasets, best alignment of positive and negative populations and cell-type
    separation
  gain_source: self-reported
  requires: [protein]
  caveats: Comparison is the authors' own; peak detection needs a visible negative population, which some markers lack;
    manual peak adjustment is sometimes needed.
  url: https://yezhengstat.github.io/ADTnorm/
  repo: yezhengSTAT/ADTnorm
  language: R
  doi: 10.1038/s41467-025-61023-6
  pmid: '40595741'
  cite_title: 'ADTnorm: robust integration of single-cell protein measurement across CITE-seq datasets'
  year: 2025
  verified: true
  papers: [pmid:39041028]
  track: QC-sweep-C
  review: 13-metrics-guides-multimodal#adtnorm
  tags: [citeseq, protein, normalisation]
- id: buus-2021
  name: Buus et al. 2021 antibody titration for CITE-seq
  kind: design
  layer: core
  categories: [ambient-rna, multimodal]
  side: additive
  tier: published-unbenchmarked
  summary: Titrates antibody concentration, staining volume and cell number for a 52-antibody 5' CITE-seq panel and shows
    that recommended concentrations cause unnecessary background from unbound antibody
  recovers: protein signal and sequencing budget otherwise spent on background tags
  gain: adjusted panel gave a 57% higher median positive signal and 43% lower background (median 26.3% to 14.9% of UMIs
    assigned to background); HLA-DR used 9% of cell-containing UMIs in lung tumour and could be cut at least fourfold
  gain_source: self-reported
  requires: [protein]
