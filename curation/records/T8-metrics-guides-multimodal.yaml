- id: martinez-de-morentin-2026
  name: Martinez-de-Morentin et al. 2026 spatial segmentation benchmark
  kind: evidence
  layer: core
  categories: [qc-benchmarks, multimodal]
  side: neutral
  tier: published-unbenchmarked
  summary: Benchmark of 11 image-based, transcript-based and multimodal cell segmentation methods on 15 datasets from 5
    imaging spatial transcriptomics technologies and 12 tissue types
  gain: performance varied widely across datasets, technologies and metrics; segmentation choice changed cell-type
    specificity, transcript contamination between neighbouring cells and ligand-receptor inference
  gain_source: independent
  caveats: No single method wins; segmentation is the cell-calling step of imaging spatial data, so its errors look like
    doublets and ambient contamination downstream.
  doi: 10.1038/s41592-026-03272-x
  pmid: '42919952'
  cite_title: Benchmarking segmentation methods for spatial transcriptomics
  year: 2026
  verified: true
  track: QC-sweep-C
