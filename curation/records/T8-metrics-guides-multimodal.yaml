# Track QC-sweep-C: QC metrics and thresholds, damaged cells, guides, and modality-specific QC
# (CITE-seq/ADT, scATAC and multiome, single-nucleus, spatial). Hand-written layer; see
# docs/review/13-metrics-guides-multimodal.md.
records:
# ---------------------------------------------------------------- QC metrics and thresholds
- id: sampleqc
  name: SampleQC
  kind: tool
  layer: core
  categories: [qc-metrics-thresholds]
  side: both
  tier: published-unbenchmarked
  summary: Fits a robust Gaussian mixture to per-cell QC metrics jointly across groups of samples with similar QC
    distributions, so each QC cell type gets its own component and outliers are called per component
  recovers: rare cell types whose QC metrics differ from the dominant type, which single-population outlier rules remove
  gain: in simulations the good cells wrongly excluded by miQC and scater-style MAD rules came almost entirely from one cell
    type, while SampleQC better preserved rare QC cell-type proportions; ran on 867k nuclei from 172 brain snRNA-seq samples
  gain_source: self-reported
  requires: [filtered-matrix, replicates]
  caveats: The authors note the simulation result depends on their design choices; the number of mixture components k is
    chosen per sample group by the user; QClus' own comparison on heart nuclei included SampleQC among seven alternatives
    it outperformed (self-reported by QClus). Repository last updated 2022.
  url: https://github.com/wmacnair/SampleQC
  repo: wmacnair/SampleQC
  language: R
  doi: 10.1186/s13059-023-02859-3
  pmid: '36765378'
  cite_title: 'SampleQC: robust multivariate, multi-cell type, multi-sample quality control for single-cell data'
  year: 2023
  verified: true
  track: QC-sweep-C
  review: 13-metrics-guides-multimodal#sampleqc
  tags: [mixture-model, multi-sample, nuclei]
- id: scuttle
  name: scuttle (per-cell QC metrics, Bioconductor)
  kind: tool
  layer: core
  categories: [qc-metrics-thresholds]
  side: both
  tier: standard
  summary: Bioconductor package that computes per-cell and per-feature QC metrics (library size, detected genes, subset
    percentages such as mito) and flags outliers with MAD rules via perCellQCMetrics, isOutlier and quickPerCellQC
  recovers: cells kept by batch-aware MAD thresholds instead of fixed cut-offs (see mad-adaptive-qc)
  gain: none of its own; it is the implementation the OSCA book and many Bioconductor pipelines use for adaptive QC
  gain_source: none
  requires: [filtered-matrix]
  caveats: Split out of scater in 2020 and has no paper of its own, so the scater paper is cited; outlier calls inherit the
    MAD caveats of [[mad-adaptive-qc]] (whole cell types with extreme healthy values can be removed if run on a mixed
    population without a batch or type block).
  url: https://bioconductor.org/packages/scuttle
  repo: LTLA/scuttle
  language: R
  doi: 10.1093/bioinformatics/btw777
  pmid: '28088763'
  cite_title: 'Scater: pre-processing, quality control, normalization and visualization of single-cell RNA-seq data in R'
  year: 2017
  verified: true
  papers: [pmid:31792435]
  track: QC-sweep-C
  review: 13-metrics-guides-multimodal#scuttle
  tags: [bioconductor, best-practice, mad]
- id: sctk-qc
  name: SCTK-QC (singleCellTK)
  kind: tool
  layer: core
  categories: [qc-metrics-thresholds, cell-calling, doublets, ambient-rna]
  side: neutral
  tier: published-unbenchmarked
  summary: Pipeline in the singleCellTK R package that runs empty-droplet detection, standard QC metrics, several doublet
    callers and ambient RNA estimation on one dataset and writes an HTML report, from the command line, R or a GUI
  recovers: nothing by itself; puts several callers side by side so that their disagreement is visible before filtering
  gain: none reported as cells retained; GUI benchmarked on 34k and 68k PBMC datasets for run time
  gain_source: none
  requires: [raw-matrix]
  caveats: A wrapper; each step has the caveats of the tool it calls (EmptyDrops, barcodeRanks, scDblFinder, cxds, bcds,
    DoubletFinder, scrublet, DecontX, SoupX). DoubletFinder dominates memory use on large data.
  url: https://bioconductor.org/packages/singleCellTK
  repo: compbiomed/singleCellTK
  language: R
  doi: 10.1038/s41467-022-29212-9
  pmid: '35354805'
  cite_title: Comprehensive generation, visualization, and reporting of quality control metrics for single-cell RNA sequencing
    data
  year: 2022
  verified: true
  track: QC-sweep-C
  review: 13-metrics-guides-multimodal#sctk-qc
  tags: [report, wrapper, bioconductor, gui]
- id: scrnabatchqc
  name: scRNABatchQC
  kind: tool
  layer: core
  categories: [qc-metrics-thresholds, batch-and-plate-effects]
  side: neutral
  tier: published-unbenchmarked
  summary: R package that compares many samples at once on technical and biological features (library size, mito,
    highly variable genes, pathway enrichment) in one HTML report to find outlier samples and batch effects
  recovers: whole samples or lanes that would otherwise be judged one at a time and either kept with a defect or discarded
  gain: none quantified
  gain_source: none
  requires: [filtered-matrix, replicates]
  caveats: Diagnostic only, no filtering model; repository last updated 2021.
  url: https://github.com/liuqivandy/scRNABatchQC
  repo: liuqivandy/scRNABatchQC
  language: R
  doi: 10.1093/bioinformatics/btz601
  pmid: '31373345'
  cite_title: 'scRNABatchQC: multi-samples quality control for single cell RNA-seq data'
  year: 2019
  verified: true
  track: QC-sweep-C
  review: 13-metrics-guides-multimodal#scrnabatchqc
  tags: [report, multi-sample]
- id: scqcea
  name: scQCEA
  kind: tool
  layer: core
  categories: [qc-metrics-thresholds]
  side: neutral
  tier: published-unbenchmarked
  summary: R package that writes an interactive QC report across sets of 10x samples and adds expression-based QC through
    cell-type enrichment against 2,348 marker genes for 95 human and mouse cell types
  recovers: a check that a library carries recognisable cell types before it is judged on counts alone
  gain: used 342 shallow-sequenced profiles to set minimum sequencing for its enrichment function; no retention numbers
  gain_source: none
  requires: [filtered-matrix, reference]
  caveats: Report and annotation tool rather than a filter; repository last updated 2023.
  url: https://isarnassiri.github.io/scQCEA/
  repo: isarnassiri/scQCEA
  language: R
  doi: 10.1186/s12864-023-09447-6
  pmid: '37415108'
  cite_title: 'scQCEA: a framework for annotation and quality control report of single-cell RNA-sequencing data'
  year: 2023
  verified: true
  track: QC-sweep-C
  review: 13-metrics-guides-multimodal#scqcea
  tags: [report, annotation]
- id: skewc
  name: SkewC
  kind: tool
  layer: core
  categories: [qc-metrics-thresholds, damaged-cells]
  side: subtractive
  tier: published-unbenchmarked
  summary: Flags cells whose gene-body read coverage is skewed relative to the protocol's typical profile, a QC signal
    independent of counts and mito fraction
  recovers: none; removes cells that would otherwise form false clusters
  gain: none quantified in the abstract
  gain_source: none
  requires: [bam]
  caveats: Most informative for full-length protocols (Smart-seq); 3' tag protocols have coverage piled at one end by
    design. Repository last updated 2023.
  url: https://github.com/LSBDT/SkewC
  repo: LSBDT/SkewC
  doi: 10.1016/j.isci.2022.103777
  pmid: '35146392'
  cite_title: 'SkewC: Identifying cells with skewed gene body coverage in single-cell RNA sequencing data'
  year: 2022
  verified: true
  papers: [pmid:36853658]
  track: QC-sweep-C
  review: 13-metrics-guides-multimodal#skewc
  tags: [full-length, coverage]
- id: sinqc
  name: SinQC
  kind: tool
  layer: core
  categories: [qc-metrics-thresholds]
  side: subtractive
  tier: published-unbenchmarked
  summary: Flags technical-artefact cells whose gene expression pattern is inconsistent with their data-quality metrics
    (mapping rate, library size, detected genes), for plate-based full-length data
  recovers: none; removes artefact cells
  gain: applied to nine datasets; no retention numbers in the abstract
  gain_source: none
  requires: [filtered-matrix]
  caveats: Built for early low-throughput plate data (2016); no public code repository found, only a lab web page.
  url: http://www.morgridge.net/SinQC.html
  doi: 10.1093/bioinformatics/btw176
  pmid: '27153613'
  cite_title: Quality control of single-cell RNA-seq by SinQC
  year: 2016
  verified: true
  track: QC-sweep-C
  review: 13-metrics-guides-multimodal#sinqc
  tags: [plate, legacy]
- id: qcatch
  name: QCatch
  kind: tool
  layer: core
  categories: [qc-metrics-thresholds, cell-calling]
  side: neutral
  tier: published-unbenchmarked
  summary: Command-line tool that takes alevin-fry or simpleaf output, calls cells and writes an interactive HTML QC report
    (UMI distributions, sequencing saturation, splicing status) plus an annotated h5ad
  recovers: none by itself; gives alevin-fry users the cell calling and QC report Cell Ranger users get by default
  gain: none quantified
  gain_source: none
  requires: [spliced-unspliced]
  caveats: Tied to the alevin-fry ecosystem; its cell calling has not been benchmarked against EmptyDrops-style callers.
  url: https://github.com/COMBINE-lab/QCatch
  repo: COMBINE-lab/QCatch
  language: Python
  doi: 10.1093/bioinformatics/btag184
  pmid: '41987571'
  cite_title: 'QCatch: a framework for quality control assessment and analysis of single-cell sequencing data'
  year: 2026
  verified: true
  papers: [pmid:40667252]
  track: QC-sweep-C
  review: 13-metrics-guides-multimodal#qcatch
  tags: [report, alevin-fry]
- id: singlecellmqc
  name: SingleCellMQC
  kind: tool
  layer: core
  categories: [qc-metrics-thresholds, multimodal]
  side: both
  tier: published-unbenchmarked
  summary: R package for QC at sample, cell, feature and batch level across scRNA-seq, antibody-derived tags and TCR/BCR
    data, combining fixed thresholds, tissue-specific reference ranges and data-driven outliers in an HTML report
  recovers: one QC pass over all modalities, so a cell is not dropped for one modality's failure without that being visible
  gain: demonstrated on a 28,498-cell PBMC multi-omics dataset, a 137,214-cell PBMC dataset and a breast atlas of over 1
    million cells; no comparison of cells retained
  gain_source: none
  requires: [filtered-matrix, protein]
  caveats: New (2026); built on Seurat and BPCells; its ADT doublet and threshold choices have not been independently
    evaluated.
  url: https://github.com/WenZhong-Lab/SingleCellMQC
  repo: WenZhong-Lab/SingleCellMQC
  language: R
  doi: 10.1016/j.isci.2026.117398
  pmid: '42733637'
  cite_title: 'SingleCellMQC: A comprehensive quality control workflow for single-cell multi-omics'
  year: 2026
  verified: true
  track: QC-sweep-C
  review: 13-metrics-guides-multimodal#singlecellmqc
  tags: [citeseq, protein, vdj, report]
- id: qclus
  name: QClus
  kind: tool
  layer: core
  categories: [qc-metrics-thresholds, cell-calling, ambient-rna]
  side: both
  tier: published-unbenchmarked
  summary: Droplet filter for difficult single-nucleus samples that clusters nuclei on unspliced fraction, mito fraction
    and cell-type marker scores and removes empty and highly contaminated droplets
  recovers: usable nuclei from high-ambient tissue (human heart) where count thresholds either keep contaminated droplets or
    remove too many nuclei
  gain: against seven alternatives (Cell Ranger 7, CellBender, SampleQC, DIEM, DecontX, DropletQC, EmptyNN) on 6 datasets,
    252 samples and over 1.9 million nuclei, highest quality in the most samples on all metrics and no processing failures
  gain_source: self-reported
  requires: [raw-matrix, spliced-unspliced]
  caveats: The comparison is the authors' own; default marker set and the initial filter (>= 500 genes, mito < 40%) are
    tuned for cardiac tissue and need changing elsewhere.
  url: https://github.com/linnalab/qclus
  repo: linnalab/qclus
  language: Python
  doi: 10.1093/nar/gkae1145
  pmid: '39656909'
  cite_title: 'QClus: a droplet filtering algorithm for enhanced snRNA-seq data quality in challenging samples'
  year: 2025
  verified: true
  track: QC-sweep-C
  review: 13-metrics-guides-multimodal#qclus
  tags: [nuclei, heart, nuclear-fraction]
- id: boloori-2026
  name: Boloori et al. 2026 gamma delta T cell counts vs QC choices
  kind: evidence
  layer: core
  categories: [qc-metrics-thresholds, qc-benchmarks]
  side: neutral
  tier: published-unbenchmarked
  summary: Re-analysis of a public 3' snRNA-seq dataset of 33,600 small-intestine nuclei showing how calling strategy and
    QC stringency change the recovered fraction of one rare cell type
  gain: gamma delta T fraction ranged 3.38-12.49% on the deposited matrix and 5.46-21.62% under strict filtering, a 3.70-
    to 4.08-fold spread; within one QC stratum the call rate rose from 0.51% to 12.17% across deciles of genes per nucleus
  gain_source: independent
  caveats: One dataset and one cell type; abstract-level numbers (no open full text found).
  doi: 10.1016/j.jim.2026.114126
  pmid: '42802005'
  cite_title: 'How many gamma delta T cells are there? Calling strategy, quality control and receptor-locus specificity in
    3-prime single-nucleus RNA sequencing of human small intestine'
  year: 2026
  verified: true
  track: QC-sweep-C
  review: 13-metrics-guides-multimodal#boloori-2026
  tags: [nuclei, rare-cell-type, cautionary]
# ---------------------------------------------------------------- damaged cells
- id: cellity
  name: cellity
  kind: tool
  layer: core
  categories: [damaged-cells, qc-metrics-thresholds]
  side: subtractive
  tier: published-unbenchmarked
  summary: Support vector machine trained on over 20 biological and technical features, with microscopy-annotated broken,
    empty and multiple-cell capture sites as labels, that classifies low-quality cells
  recovers: none; removes broken and empty captures that count thresholds miss
  gain: over 30% higher classification accuracy than traditional threshold methods on about 5,000 Fluidigm C1 cells (CD4+ T
    cells, BMDCs, mESCs); SVM specificity 20-30% higher than unsupervised alternatives
  gain_source: self-reported
  requires: [filtered-matrix]
  caveats: Trained on C1 plate data with imaging ground truth; transfer to droplet data is untested. Repository last
    updated 2016, though the package remains in Bioconductor (release 3.23).
  url: https://bioconductor.org/packages/cellity
  repo: Teichlab/cellity
  language: R
  doi: 10.1186/s13059-016-0888-1
  pmid: '26887813'
  cite_title: Classification of low quality cells from single-cell RNA-seq data
  year: 2016
  verified: true
  track: QC-sweep-C
  review: 13-metrics-guides-multimodal#cellity
  tags: [plate, supervised, ground-truth-imaging]
- id: montserrat-ayuso-2024
  name: Montserrat-Ayuso & Esteve-Codina 2024 nuclear fraction in reference atlases
  kind: evidence
  layer: core
  categories: [damaged-cells, qc-benchmarks]
  side: neutral
  tier: published-unbenchmarked
  summary: Re-analysis of six reference atlases using intronic (nuclear) fraction and MALAT1 expression to find nuclei-free,
    low-quality cells left in after the atlases' own QC
  gain: 6 atlases (Tabula Muris, Tabula Muris Senis, Tabula Sapiens, HCA liver and retina, a mouse kidney atlas), over 500
    samples, 150 cell types and 20 tissues; some organs carry up to 85% low-quality cells
  gain_source: independent
  caveats: Argues for stricter filtering, the opposite direction to the salvage literature; the two agree that the deciding
    metric should be nuclear fraction, not mito or counts.
  doi: 10.1186/s12864-024-11015-5
  pmid: '39574015'
  cite_title: 'High content of nuclei-free low-quality cells in reference single-cell atlases: a call for more stringent quality
    control using nuclear fraction'
  year: 2024
  verified: true
  track: QC-sweep-C
  review: 13-metrics-guides-multimodal#montserrat-ayuso-2024
  tags: [nuclear-fraction, malat1, atlas, cautionary]
- id: malat1-quality-marker
  name: MALAT1 as a cell-quality marker (Clarke & Bader 2024)
  kind: method
  layer: core
  categories: [damaged-cells, qc-metrics-thresholds]
  side: both
  tier: published-unbenchmarked
  summary: Uses expression of MALAT1, a nuclear-retained non-coding RNA expressed in nearly all cell types, as a cheap proxy
    for the spliced/unspliced ratio to spot empty droplets and cytoplasm-poor cells
  recovers: a damage signal without re-reading BAMs for spliced and unspliced counts
  gain: MALAT1 expression was strongly correlated with the splice-ratio measure (preprint; no number in the abstract)
  gain_source: self-reported
  requires: [filtered-matrix]
  caveats: Preprint; applies only to species with a conserved MALAT1; single-nucleus data are nuclear by design, so a high
    MALAT1 there does not mark damage.
  url: https://www.biorxiv.org/content/10.1101/2024.07.14.603469
  doi: 10.1101/2024.07.14.603469
  cite_title: MALAT1 expression indicates cell quality in single-cell RNA sequencing data
  year: 2024
  verified: true
  papers: [pmid:39574015]
  track: QC-sweep-C
  review: 13-metrics-guides-multimodal#malat1-quality-marker
  tags: [preprint, malat1, nuclear-fraction]
# ---------------------------------------------------------------- guides and frameworks
- id: luecken-theis-2019
  name: Luecken & Theis 2019 best-practice tutorial
  kind: evidence
  layer: core
  categories: [qc-benchmarks]
  side: neutral
  tier: standard
  summary: Tutorial and review that sets out a scRNA-seq workflow from QC to downstream analysis with recommendations drawn
    from independent comparison studies, applied to a public dataset
  gain: recommended permissive, per-sample QC thresholds judged jointly on counts, genes and mito, and revisiting QC after
    clustering
  gain_source: none
  caveats: Superseded for most steps by the 2023 scverse guide ([[heumos-2023]]); fixed example thresholds in the case study
    are often copied without the joint-inspection advice.
  url: https://github.com/theislab/single-cell-tutorial
  repo: theislab/single-cell-tutorial
  doi: 10.15252/msb.20188746
  pmid: '31217225'
  cite_title: 'Current best practices in single-cell RNA-seq analysis: a tutorial'
  year: 2019
  verified: true
  track: QC-sweep-C
  review: 13-metrics-guides-multimodal#luecken-theis-2019
  tags: [guide, best-practice, scanpy]
- id: heumos-2023
  name: Heumos et al. 2023 scverse best practices across modalities
  kind: evidence
  layer: core
  categories: [qc-benchmarks, multimodal]
  side: neutral
  tier: standard
  summary: Review and online book (sc-best-practices.org) that summarises independent benchmarks into recommended workflows
    for scRNA-seq, scATAC-seq, CITE-seq, immune repertoire and spatial data
  gain: QC defaults of 5 MADs on log counts, log genes and top-20-gene share, mito flagged only when > 3 MADs and > 8%;
    SoupX for ambient RNA; scDblFinder for doublets; for ATAC, TSS enrichment, fragment counts and nucleosome signal
  gain_source: none
  caveats: Where no independent benchmark exists the guide contrasts popular tools rather than ranking them; QC thresholds
    are defaults, not tested on treated or stressed cells.
  url: https://www.sc-best-practices.org
  repo: theislab/single-cell-best-practices
  doi: 10.1038/s41576-023-00586-w
  pmid: '37002403'
  cite_title: Best practices for single-cell analysis across modalities
  year: 2023
  verified: true
  track: QC-sweep-C
  review: 13-metrics-guides-multimodal#heumos-2023
  tags: [guide, best-practice, scverse, scanpy]
- id: osca
  name: OSCA, Orchestrating Single-Cell Analysis with Bioconductor
  kind: evidence
  layer: core
  categories: [qc-benchmarks]
  side: neutral
  tier: standard
  summary: Paper and online book describing the Bioconductor single-cell workflow, including per-batch MAD outlier QC with
    scuttle, EmptyDrops cell calling, doublet scoring and ADT-specific QC
