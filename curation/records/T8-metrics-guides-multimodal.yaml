  year: 2022
  verified: true
  track: QC-sweep-C
  review: 13-metrics-guides-multimodal#spotclean
  tags: [spatial, visium, ambient]
- id: spotsweeper
  name: SpotSweeper
  kind: tool
  layer: core
  categories: [qc-metrics-thresholds, multimodal]
  side: both
  tier: published-unbenchmarked
  summary: Spatially aware QC for spatial transcriptomics that compares each spot's metrics with its local neighbourhood to
    find local outliers and regional artefacts instead of using dataset-wide thresholds
  recovers: spots in biologically low-count regions (for example white matter) that global thresholds remove
  gain: identified a consistent set of systematically low-quality Visium barcoded spots across public datasets and two
    distinct regional artefact types (self-reported)
