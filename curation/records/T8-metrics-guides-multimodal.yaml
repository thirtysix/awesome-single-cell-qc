- id: snapatac2
  name: SnapATAC2
  kind: tool
  layer: core
  categories: [qc-metrics-thresholds, multimodal]
  side: both
  tier: benchmarked-sota
  summary: Python and Rust package for single-cell epigenomics that computes fragment and TSS enrichment QC on genome bins
    and embeds cells with a matrix-free spectral method that scales linearly with cell number
  recovers: cell-type structure in complex datasets with less leakage of sequencing depth into the embedding
  gain: 'Luo 2024 (independent): with SnapATAC preferred for datasets with complex cell-type structure, among the most
    scalable, and its cosine embedding correlated only ~0.2 with library size versus 0.5-0.75 for Signac and ArchR'
  gain_source: independent
  requires: [bam]
  caveats: Works on genome bins without peak calling, so peak-based QC such as FRiP is unavailable; Chromap's QC preprint
