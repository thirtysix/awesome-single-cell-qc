    fragments in peaks and blacklist ratio for QC, then runs LSI, clustering and integration with RNA
  recovers: none specific; standard QC entry point for 10x multiome in R
  gain: 'scaled to over 700,000 cells (self-reported); Luo 2024: its LSI embedding was outperformed on clustering by
