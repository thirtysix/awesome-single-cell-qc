# ---------------------------------------------------------------- spatial
- id: spotclean
  name: SpotClean
  kind: tool
  layer: core
  categories: [ambient-rna, multimodal]
  side: both
  tier: published-unbenchmarked
  summary: Probabilistic model of spot swapping in sequencing-based spatial transcriptomics (Visium) that uses off-tissue
    spots to estimate how UMIs bleed between spots and returns decontaminated counts
  recovers: spot-specific expression, sharper marker genes and tissue-region boundaries
  gain: in a tumour section over 13% of spots were labelled malignant in raw data but not after SpotClean, matching the H&E
    better (self-reported)
  gain_source: self-reported
  requires: [raw-matrix]
  caveats: Needs at least 25% of spots off tissue to estimate contamination; built for Visium-style arrays.
  url: https://bioconductor.org/packages/SpotClean
  repo: zijianni/SpotClean
  language: R
  doi: 10.1038/s41467-022-30587-y
  pmid: '35624112'
