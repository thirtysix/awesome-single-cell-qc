- id: sat-gene-panels
  name: Stress-altered transcription gene panels (Yan 2026)
  kind: method
  layer: core
  categories: [cell-cycle-and-stress]
  side: both
  tier: published-unbenchmarked
  summary: Tissue-specific dissociation-stress gene panels for brain and skull bone marrow, refined by random forest from
    paired gentle and conventional preparations, used to detect and remove the artefact retrospectively
  recovers: published datasets prepared with conventional dissociation
  gain: the optimised protocol cut stress-altered transcription by about 95%; the panels alone cut it by 60-64% (self-reported)
  gain_source: self-reported
