  caveats: Its own paper reports accuracy similar to Scrublet on cell-line hashing data but less discriminative on human-mouse
    and PBMC benchmarks.
  doi: 10.1177/15578666261489802
  pmid: '42781809'
  cite_title: 'Xoublet: An Extreme-Scale Doublet Detection Algorithm for Cardiac Single-Cell Transcriptomics'
  year: 2026
  verified: true
  track: QC-sweep-B
  review: 12-doublets-stress-batch#xoublet
