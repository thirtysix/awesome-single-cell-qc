- id: swappeddrops
  name: swappedDrops (DropletUtils) barcode-swapping removal
  kind: tool
  layer: core
  categories: [batch-and-plate-effects, ambient-rna]
  side: subtractive
  tier: published-unbenchmarked
  summary: Removes molecules whose cell barcode and UMI appear in more than one sample sequenced together, which are products
    of index swapping on patterned flow cells
  gain: about 2.5% of reads were swapped between samples on a HiSeq 4000 in plate-based data; swapping produced complex artefactual
    cell libraries in 10x data (self-reported)
