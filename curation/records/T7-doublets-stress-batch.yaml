# Track QC-sweep-B: doublets and multiplets, cell cycle and stress signatures, batch, lane and plate effects.
# Hand-written layer; see docs/review/12-doublets-stress-batch.md.
records:

# ------------------------------------------------------------------------------------------- doublets, RNA
- id: doubletfinder
  name: DoubletFinder
  kind: tool
  layer: core
  categories: [doublets]
  side: subtractive
  tier: benchmarked-sota
  summary: Scores each cell by the fraction of artificial doublets (averaged random cell pairs) among its nearest neighbours
    in PC space, with a parameter sweep (pK) chosen from the data
  recovers: cleaner clusters and DE results; singlets otherwise lost to a high-UMI cap
  gain: 'Xi & Li 2021: highest mean AUPRC (0.537) on 16 real datasets with annotated doublets, top method on the most datasets
    and across simulated settings, among the most robust at removing spurious clusters; Ttoouli 2025: among the top three
    by clustering quality after removal'
  gain_source: independent
  requires: [filtered-matrix]
  caveats: 'Slower than cxds or Scrublet and less stable across subsamples (Xi & Li 2021); misclassified more singlets than
    scds, scDblFinder or Scrublet in pooled PBMC data (Demuxafy 2024); mean AUPRC 0.13-0.34 for all detectors on lineage-barcoded
    cell-line data (singletCode 2024); targets heterotypic doublets and needs the expected doublet rate as input.'
  url: https://github.com/chris-mcginnis-ucsf/DoubletFinder
  repo: chris-mcginnis-ucsf/DoubletFinder
  language: R
  doi: 10.1016/j.cels.2019.03.003
  pmid: '30954475'
  cite_title: 'DoubletFinder: Doublet Detection in Single-Cell RNA Sequencing Data Using Artificial Nearest Neighbors'
  year: 2019
  verified: true
  benchmarks: [xi-li-2021-doublet-benchmark, xi-li-2021-doublet-protocol, neavin-2024-demuxafy-benchmark, zhang-2024-singletcode,
    ttoouli-2025-multiplets]
  track: QC-sweep-B
  review: 12-doublets-stress-batch#doubletfinder
  tags: [seurat, artificial-doublets, knn]

- id: scrublet
  name: Scrublet
  kind: tool
  layer: core
  categories: [doublets]
  side: subtractive
  tier: benchmarked-sota
  summary: Simulates doublets from the data and scores each barcode with a nearest-neighbour classifier, without needing
    clusters; the default doublet step in scanpy and many Python pipelines
  recovers: singlets that a high-UMI cap would discard; cleaner clusters
  gain: 'Ttoouli 2025 (hashing truth): most accurate tool by AUROC; Demuxafy 2024: with scDblFinder, classified the most
    doublets correctly in pools of 16 donors or fewer; Xi & Li 2021: strong in simulations and one of two methods whose HVGs
    beat the negative control at all doublet rates'
  gain_source: independent
  requires: [filtered-matrix]
  caveats: Threshold is set between two modes of the simulated score distribution, which are often not bimodal; among the
    detectors most affected by simulated ambient RNA (Demuxafy 2024); still missed most hashing multiplets (Ttoouli 2025).
  url: https://github.com/swolock/scrublet
  repo: swolock/scrublet
  language: Python
  doi: 10.1016/j.cels.2018.11.005
  pmid: '30954476'
  cite_title: 'Scrublet: Computational Identification of Cell Doublets in Single-Cell Transcriptomic Data'
  year: 2019
  verified: true
  benchmarks: [xi-li-2021-doublet-benchmark, xi-li-2021-doublet-protocol, neavin-2024-demuxafy-benchmark, zhang-2024-singletcode,
    ttoouli-2025-multiplets]
  track: QC-sweep-B
  review: 12-doublets-stress-batch#scrublet
  tags: [scanpy, artificial-doublets, knn]

- id: scds
  name: scds (cxds, bcds, hybrid)
  kind: tool
  layer: core
  categories: [doublets]
  side: subtractive
  tier: benchmarked-sota
  summary: 'Two doublet scores and their combination: cxds scores unlikely co-expression of gene pairs on binarised counts,
    bcds trains gradient boosting against artificial doublets, hybrid averages them'
  recovers: fast doublet scoring for large datasets without clustering
  gain: 'Demuxafy 2024: scds, scDblFinder and Scrublet the top doublet detectors by MCC and balanced accuracy; Xi & Li 2021:
    cxds fastest and most resource-efficient, hybrid one of only two methods to beat the library-size and gene-count baselines
    on all 16 datasets'
  gain_source: independent
  requires: [filtered-matrix]
  caveats: cxds alone has medium accuracy and cxds, bcds and hybrid were unstable at removing spurious clusters (Xi & Li 2021);
    bcds found the most unique multiplets but had the lowest accuracy against hashing (Ttoouli 2025).
  url: https://bioconductor.org/packages/scds
  repo: kostkalab/scds
  language: R
  doi: 10.1093/bioinformatics/btz698
  pmid: '31501871'
  cite_title: 'scds: computational annotation of doublets in single-cell RNA sequencing data'
  year: 2020
  verified: true
  benchmarks: [xi-li-2021-doublet-benchmark, xi-li-2021-doublet-protocol, neavin-2024-demuxafy-benchmark, zhang-2024-singletcode,
    ttoouli-2025-multiplets]
  track: QC-sweep-B
  review: 12-doublets-stress-batch#scds
  tags: [bioconductor, co-expression, fast]

- id: solo
  name: Solo
  kind: tool
  layer: core
  categories: [doublets]
  side: subtractive
  tier: benchmarked-sota
  summary: Embeds cells with a variational autoencoder and trains a classifier head to separate simulated doublets from observed
    cells; now maintained inside scvi-tools
  recovers: singlets and cleaner clusters
  gain: 'Xi & Li 2021: highest mean AUROC on 16 real datasets, beat both baselines on every dataset, highest precision and
    TNR (with DoubletFinder) and recall (with hybrid) at matched doublet numbers; Demuxafy 2024: better than scds in pools
    of more than 16 donors'
  gain_source: independent
  requires: [filtered-matrix]
  caveats: Slowest and most memory-hungry detector in Demuxafy (median 13 h per ~20,000-cell pool) and the only one whose
    run time did not scale linearly (Xi & Li 2021); GPU preferred; the standalone calico/solo repository is archived in favour
    of scvi-tools.
  url: https://docs.scvi-tools.org
  repo: calico/solo
  language: Python
  doi: 10.1016/j.cels.2020.05.010
  pmid: '32592658'
  cite_title: 'Solo: Doublet Identification in Single-Cell RNA-Seq via Semi-Supervised Deep Learning'
  year: 2020
  verified: true
  benchmarks: [xi-li-2021-doublet-benchmark, neavin-2024-demuxafy-benchmark]
  track: QC-sweep-B
  review: 12-doublets-stress-batch#solo
  tags: [deep-learning, scvi-tools, gpu]

- id: doubletdetection
  name: DoubletDetection
  kind: tool
  layer: core
  categories: [doublets]
  side: subtractive
  tier: benchmarked-sota
  summary: Repeatedly adds synthetic doublets, clusters with PhenoGraph or Louvain and scores cells by how often they fall
    in doublet-rich clusters, giving p-value based calls
  recovers: singlets and cleaner clusters
  gain: 'Demuxafy 2024: lowest share of wrongly classified droplets among doublet detectors (about 1% at 2 donors, about
    3% at 16 or more); Xi & Li 2021: with DoubletFinder the most robust at restoring the correct number of clusters; Ttoouli
    2025: among the top three by clustering quality'
  gain_source: independent
  requires: [filtered-matrix]
  caveats: No peer-reviewed paper (cited by Zenodo DOI); failed on one of 16 datasets and among the slower methods (Xi & Li
    2021).
  url: https://github.com/JonathanShor/DoubletDetection
  repo: JonathanShor/DoubletDetection
  language: Python
  doi: 10.5281/zenodo.2678041
  cite_title: 'JonathanShor/DoubletDetection: doubletdetection v4.3.0.post1'
  year: 2019
  verified: true
  benchmarks: [xi-li-2021-doublet-benchmark, xi-li-2021-doublet-protocol, neavin-2024-demuxafy-benchmark, ttoouli-2025-multiplets]
  track: QC-sweep-B
  review: 12-doublets-stress-batch#doubletdetection
  tags: [clustering, zenodo]

- id: doubletcells
  name: doubletCells / computeDoubletDensity (scran, scDblFinder)
  kind: tool
  layer: core
  categories: [doublets]
  side: subtractive
  tier: benchmarked
  summary: Scores each cell by the local density of simulated doublets relative to real cells in a reduced space; moved from
    scran's doubletCells to scDblFinder's computeDoubletDensity
  gain: 'Xi & Li 2021: the only method that did not beat the library-size and gene-count baselines on a majority of the 16
    datasets, and the only one that left spurious trajectory branches'
  gain_source: independent
  requires: [filtered-matrix]
  caveats: Superseded by scDblFinder's classifier in the same package; retained in OSCA as a cluster-free score.
  url: https://bioconductor.org/packages/scDblFinder
  repo: plger/scDblFinder
  language: R
  doi: 10.12688/f1000research.9501.2
  pmid: '27909575'
  cite_title: A step-by-step workflow for low-level analysis of single-cell RNA-seq data with Bioconductor
  year: 2016
  verified: true
  benchmarks: [xi-li-2021-doublet-benchmark, xi-li-2021-doublet-protocol, ttoouli-2025-multiplets]
  track: QC-sweep-B
  review: 12-doublets-stress-batch#doubletcells
  tags: [bioconductor, osca]

- id: vaeda
  name: vaeda
  kind: tool
  layer: core
  categories: [doublets]
  side: subtractive
  tier: published-unbenchmarked
  summary: Combines a variational autoencoder with positive-unlabeled learning to give doublet scores and binary calls
  gain: competitive with seven existing methods on the 16 Xi & Li benchmark datasets and ahead of the other Python-based
    methods (self-reported)
  gain_source: self-reported
  requires: [filtered-matrix]
  caveats: From the scds authors; not yet in an independent benchmark.
  url: https://github.com/kostkalab/vaeda
  repo: kostkalab/vaeda
  language: Python
  doi: 10.1093/bioinformatics/btac720
  pmid: '36342203'
  cite_title: Vaeda computationally annotates doublets in single-cell RNA sequencing data
  year: 2023
  verified: true
  track: QC-sweep-B
  review: 12-doublets-stress-batch#vaeda
  tags: [deep-learning, pu-learning]

- id: chord
  name: Chord
  kind: tool
  layer: core
  categories: [doublets]
  side: subtractive
  tier: benchmarked
  summary: Ensemble that trains a gradient-boosting model on the scores of several doublet detectors (by default DoubletFinder,
    scds and others) against simulated doublets
  gain: higher accuracy and stability than its component methods on real and synthetic data (self-reported)
  gain_source: self-reported
  requires: [filtered-matrix]
  caveats: 'Independent tests did not confirm the ensemble gain: Demuxafy (scds plus DoubletFinder intersection) outperformed
    Chord in pools of 8 or more donors, with Chord making more false singlet and false doublet calls; on singletCode barcoded
    data the ensembles (hybrid, Chord) did not always beat their components.'
  url: https://github.com/13308204545/Chord
  repo: 13308204545/Chord
  language: R
  doi: 10.1038/s42003-022-03476-9
  pmid: '35637301'
  cite_title: 'Chord: an ensemble machine learning algorithm to identify doublets in single-cell RNA sequencing data'
  year: 2022
  verified: true
  benchmarks: [neavin-2024-demuxafy-benchmark, zhang-2024-singletcode]
  track: QC-sweep-B
  review: 12-doublets-stress-batch#chord
  tags: [ensemble]

- id: socube
  name: SoCube
  kind: tool
  layer: core
  categories: [doublets]
