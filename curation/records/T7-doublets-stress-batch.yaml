- id: lun-marioni-2017
  name: Lun & Marioni 2017 plate effects in DE
  kind: evidence
  layer: core
  categories: [batch-and-plate-effects, low-cell-stats]
  side: neutral
  tier: published-unbenchmarked
  summary: When the groups compared were processed on separate plates, cell-level DE lost type I error control; summing counts
    per plate and testing plates restored it without loss of power in simulations
  gain: restored type I error control under plate effects and improved specificity and gene ranking on real data
  gain_source: self-reported
  requires: [replicates]
  caveats: Needs several plates per group; with one plate per condition, plate and condition cannot be separated by any method.
  doi: 10.1093/biostatistics/kxw055
