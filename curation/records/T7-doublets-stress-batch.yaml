- id: double-jeopardy
  name: Double-jeopardy (multi-omic doublet detection)
  kind: method
  layer: core
  categories: [doublets, multimodal]
  side: subtractive
  tier: published-unbenchmarked
  summary: Labels droplets with impossible receptor or protein combinations (several BCR/TCR chains, mutually exclusive CITE-seq
    markers) as doublets and trains a classifier on their transcriptomes to find further doublets, including homotypic ones
  recovers: homotypic lymphocyte doublets that expression-only detectors miss
  gain: high sensitivity and specificity in inflammatory-cell-dominant samples (self-reported, qualitative in the abstract)
  gain_source: self-reported
  requires: [filtered-matrix, protein]
  caveats: Needs VDJ-seq or CITE-seq; anchored on immune cells.
  doi: 10.1016/j.crmeth.2021.100008
  pmid: '34278374'
  cite_title: 'Double-jeopardy: scRNA-seq doublet/multiplet detection using multi-omic profiling'
  year: 2021
  verified: true
  track: QC-sweep-B
  review: 12-doublets-stress-batch#double-jeopardy
  tags: [vdj, cite-seq, immune]

- id: multi-round-doublet-removal
  name: Multi-round doublet removal (MRDR)
  kind: method
  layer: core
  categories: [doublets]
  side: subtractive
  tier: published-unbenchmarked
  summary: Runs a doublet detector two or more times, removing calls between rounds, to offset the randomness of artificial-doublet
    simulation
  gain: 'two rounds of DoubletFinder raised recall by 50% over one round on 14 real datasets; cxds twice was best on 29 barcoded
    and 106 synthetic datasets, with ROC up by at least 0.05 for all four tools tested (self-reported)'
  gain_source: self-reported
  requires: [filtered-matrix]
  caveats: More rounds remove more barcodes, so the recall gain is partly a higher removal rate; singlet loss per round not
    reported in the abstract.
  doi: 10.1016/j.csbj.2025.01.009
  pmid: '39911841'
  cite_title: Improving doublet cell removal efficiency through multiple algorithm runs
  year: 2025
  verified: true
  track: QC-sweep-B
  review: 12-doublets-stress-batch#multi-round-doublet-removal
  tags: [strategy]

- id: expected-doublet-rate
  name: Expected doublet rate from loading (Poisson / vendor table)
  kind: method
  layer: core
  categories: [doublets, screen-design]
  side: neutral
  tier: standard
  summary: Sets the number of barcodes a detector calls from the expected multiplet rate for the number of cells loaded, about
    0.8% per 1,000 recovered cells on 10x Chromium
  gain_source: none
  requires: [filtered-matrix]
  caveats: Ttoouli 2025 found the 10x rule consistently underestimates the multiplets marked by hashing; the rate covers all
    doublets, so in hashed or genotype-pooled data the within-sample (undetectable by tags) share is only about 1/N of it
    for N equal pools; Demuxafy ran Scrublet with R = N x 0.008 / 1000.
  url: https://www.10xgenomics.com/support
  verified: false
  benchmarks: [ttoouli-2025-multiplets]
  track: QC-sweep-B
  review: 12-doublets-stress-batch#expected-doublet-rate
  tags: [10x, loading, threshold]

- id: stealth-multiplets
  name: Stealth multiplets in sample multiplexing (Nakaki & Sharpe 2025)
  kind: evidence
  layer: core
  categories: [doublets, demux-hashing]
  side: neutral
  tier: published-unbenchmarked
  summary: Models four classes of multiplet in sample-multiplexed droplet data (homogeneous stealth, partial stealth, multilabelled,
    unlabelled) and shows partial-stealth multiplets, where one cell's label is lost, in real hashed and genotype-pooled datasets
  gain: none (cautionary finding)
  gain_source: none
  requires: [tag-counts]
  caveats: Probabilities are model-based; partial-stealth multiplets matter most when labelling or demultiplexing is weak.
  doi: 10.1186/s12864-025-11835-z
  pmid: '40702454'
  cite_title: Probability of stealth multiplets in sample-multiplexing for droplet-based single-cell analysis
  year: 2025
  verified: true
  track: QC-sweep-B
  review: 12-doublets-stress-batch#stealth-multiplets
  tags: [hashing, genotype, theory]

- id: multi-tcr-doublets
  name: Multiple TCR chains as a doublet marker in superloaded runs (Sserwadda 2025)
  kind: evidence
  layer: core
  categories: [doublets, screen-design]
  side: subtractive
  tier: published-unbenchmarked
  summary: In standard and superloaded multiplexed thymus and blood runs, over half of the T cells expressing multiple TCR
    chains were doublets, so receptor configuration adds a doublet filter that expression-based tools lack
  gain: superloading caused minimal transcriptomic differences; over 50% of multi-TCR-chain T cells were doublets regardless
    of loading
  gain_source: independent
  caveats: Immune cells with paired VDJ data only.
  doi: 10.1080/08820139.2025.2457039
  pmid: '39882751'
  cite_title: Superloaded Multiplexed scRNA-seq Data Preserves Primary Immune Cell Heterogeneity but Necessitates Stringent
    Doublet Removal
  year: 2025
  verified: true
  track: QC-sweep-B
  review: 12-doublets-stress-batch#multi-tcr-doublets
  tags: [vdj, superloading, immune]

# ------------------------------------------------------------------------------------------- doublets, ATAC and multiome
- id: amulet
  name: AMULET
  kind: tool
  layer: core
  categories: [doublets, multimodal]
  side: subtractive
  tier: published-unbenchmarked
  summary: Flags snATAC-seq nuclei with too many genomic loci covered by more than two reads, which a diploid nucleus cannot
    produce, so it detects homotypic as well as heterotypic multiplets without simulation
  recovers: homotypic multiplets that simulation-based ATAC callers miss
  gain: recall on simulated heterotypic multiplets 0.80 and 0.90 in two PBMC samples against 0.25 and 0.23 for ArchR; precision
    estimated from donor multiplexing (self-reported)
  gain_source: self-reported
  requires: [bam]
  caveats: Needs depth (works best above about 25K median valid reads per nucleus); on low-depth islet data recall fell to
    0.35-0.37 and ArchR was higher on one sample; scDblFinder's authors found it good on only one of three datasets.
  url: https://github.com/UcarLab/AMULET
  repo: UcarLab/AMULET
  language: multiple
  doi: 10.1186/s13059-021-02469-x
  pmid: '34465366'
  cite_title: 'AMULET: a novel read count-based method for effective multiplet detection from single nucleus ATAC-seq data'
  year: 2021
  verified: true
  papers: [pmid:35814628]
  track: QC-sweep-B
  review: 12-doublets-stress-batch#amulet
  tags: [atac, multiome, fragments]

