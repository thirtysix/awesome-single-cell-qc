- id: handling-vs-drug-stress
  name: Separate handling stress from drug-induced stress with matched vehicle wells
  kind: hypothesis
  layer: core
  categories: [cell-cycle-and-stress, screen-design]
  side: both
  tier: hypothesis
  summary: Many drugs induce the same immediate-early and heat-shock genes as dissociation, so a stress score should be compared
    with vehicle wells handled in the same lane and time, and only the vehicle-matched excess read as response
  recovers: genuine stress responses that a global stress-score regression or filter would remove, and drug calls that are
    really handling artefacts
  gain: none measured; handling time alone changed 1,185 PBMC genes (Massoni-Badosa 2020) and enzymatic digestion created
    a stress cluster (Marsh 2022)
  gain_source: none
  requires: [multiple-conditions, replicates]
  caveats: Needs vehicle controls in every lane or plate and matched handling time; cultured lines have less dissociation stress
    than tissue but trypsinisation and wait times still apply.
  verified: false
  track: QC-sweep-B
  review: 12-doublets-stress-batch#handling-vs-drug-stress
  tags: [drug-screen, controls]

