  kind: tool
  layer: core
  categories: [batch-and-plate-effects, integration]
  side: neutral
  tier: standard
  summary: Tests whether the batch composition of each cell's neighbourhood matches the global composition and reports a
    rejection rate; the same package includes a principal-component regression on batch
  gain_source: none
