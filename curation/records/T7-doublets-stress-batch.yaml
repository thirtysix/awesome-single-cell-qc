# ------------------------------------------------------------------------------------------- cell cycle
- id: seurat-cell-cycle-scoring
  name: Seurat CellCycleScoring / scanpy score_genes_cell_cycle
  kind: method
  layer: core
  categories: [cell-cycle-and-stress]
  side: neutral
  tier: standard
  summary: Scores S and G2/M marker sets (Tirosh 2016 lists) against control genes and assigns each cell to G1, S or G2M by
