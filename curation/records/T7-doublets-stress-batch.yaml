- id: xoublet
  name: Xoublet
  kind: tool
  layer: core
  categories: [doublets]
  side: subtractive
  tier: published-unbenchmarked
  summary: Scrublet-like doublet scoring with a hierarchical tree for fast neighbour search, built for atlas-scale data
  gain: 2,479,674 HeartMap profiles scored in 574.8 s and 4.14 GiB peak memory against 1060.6 s and 22.81 GiB for the Scrublet
    core (self-reported)
  gain_source: self-reported
