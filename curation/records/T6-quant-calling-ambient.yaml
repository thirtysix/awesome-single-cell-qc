- id: zumis
  name: zUMIs
  kind: tool
  layer: core
  categories:
  - alignment-quantification
  side: neutral
  tier: benchmarked
  summary: STAR-based pipeline for UMI protocols (plate and droplet) that counts exonic and intronic reads separately and together,
    with optional downsampling to equal depth
  recovers: more genes and counts per cell from intronic reads
