- id: reference-optimisation
  name: Optimised transcriptomic references for scRNA-seq (Pool et al. 2023)
  kind: method
  layer: core
  categories:
  - alignment-quantification
  side: additive
  tier: published-unbenchmarked
  summary: Rebuilds the gene annotation used for counting by extending poorly annotated 3' ends, adding a hybrid pre-mRNA mapping
    strategy and resolving overlapping genes, so reads lost as intergenic or ambiguous are counted
  recovers: genes and marker genes missing from droplet data, and cell types they define
  gain: recovered missing gene expression and revealed missing cell types and marker genes across mouse and human tissue datasets
    (self-reported, abstract)
  gain_source: self-reported
  requires:
  - fastq
  caveats: Gains are specific to how badly the default annotation fits the tissue; requires re-running alignment; no independent
    comparison found. Related evidence that the annotation choice matters - Bruning 2022 found the unfiltered annotation (with
    pseudogenes) lowered mito fractions and gave up to 10% more cells per sample.
  doi: 10.1038/s41592-023-02003-w
  pmid: '37697162'
  cite_title: Recovery of missing single-cell RNA-sequencing data with optimized transcriptomic references
  year: 2023
  verified: true
