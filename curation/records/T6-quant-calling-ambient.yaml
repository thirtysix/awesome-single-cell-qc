- id: kallisto-bustools
  name: kallisto | bustools (kb-python)
  kind: tool
  layer: core
  categories:
  - alignment-quantification
  side: neutral
  tier: benchmarked
  summary: Pseudoalignment of reads to a transcriptome (or nascent plus mature, 'nac', index) written to BUS files, with barcode
    correction, UMI collapsing and counting in bustools, wrapped by kb-python
  recovers: speed and constant memory; higher gene detection per cell than Cell Ranger in many non-model organisms (Shainer 2021)
  gain: 'Shainer 2021 (22 public 10x datasets, 8 organisms): higher alignment and gene detection rates than Cell Ranger; in zebrafish
    pineal data it resolved an extra photoreceptor type; Bruning 2022: 4-6x faster than Cell Ranger 6; Du 2020: ~4x faster
    and 7.7x less memory than STAR'
  gain_source: independent
  requires:
  - fastq
  caveats: 'Older spliced-only indices gave spurious genes: extra Vmn and Olfr genes and many low-gene, unlabelled barcodes (Bruning
    2022), mean relative false-positive expression 0.328 per cell in the alevin-fry simulation (competitor); v0.39.3 was unsuitable
    for 6-bp-UMI CEL-Seq2 data and emptyDrops on its 10x output called ~60,000 cells against ~3,000 expected (You 2021). Fewer
    genes and lower expression than STAR (Du 2020). The 2025 nac index with distinguishing flanking k-mers targets these
    problems but has no independent benchmark.'
  url: https://www.kallistobus.tools
  repo: pachterlab/kb_python
  language: multiple
  doi: 10.1038/s41587-021-00870-2
  pmid: '33795888'
