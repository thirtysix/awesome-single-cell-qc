- id: bruning-2022
  name: Brüning et al. 2022 single-cell aligner comparison
  kind: evidence
  layer: core
  categories:
  - alignment-quantification
  - qc-benchmarks
  side: neutral
  tier: published-unbenchmarked
  summary: Independent comparison of Cell Ranger 6, STARsolo, kallisto, salmon alevin and alevin-fry on three 10x datasets
    (human PBMC, mouse heart after infarction, mouse endothelial atlas) for whitelisting, cells, genes, clustering and DE
  gain: STARsolo, Cell Ranger 6, alevin and alevin-fry gave similar gene sets; kallisto reported the most cells but many were
    low-gene and unlabelled, and it detected extra Vmn and Olfr genes (likely artefacts); alevin found ~50% of cardiac endothelial
    cells; the unfiltered annotation gave up to 10% more cells per sample and lower mito fractions; STARsolo, alevin and kallisto
    were >= 3x faster than Cell Ranger 6
  gain_source: independent
  caveats: Three 10x datasets, default settings and 2021-era versions (kallisto before nac indices); no ground truth for cell
    identity beyond marker-based labels.
  doi: 10.1093/gigascience/giac001
  pmid: '35084033'
  cite_title: Comparative analysis of common alignment tools for single-cell RNA sequencing
  year: 2022
