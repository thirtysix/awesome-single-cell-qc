# ------------------------------------------------------------------ alignment and quantification
- id: cellranger
  name: Cell Ranger (cellranger count / multi)
  kind: tool
  layer: core
  categories:
  - alignment-quantification
  - cell-calling
  side: neutral
  tier: standard
  summary: 10x Genomics pipeline that aligns reads with STAR, corrects barcodes and UMIs against the kit whitelist, counts
    UMIs per gene and calls cells, producing the raw and filtered matrices most 10x analyses start from
  recovers: a reproducible, vendor-supported count matrix; low-RNA cells through its EmptyDrops-style second calling step
  gain: 'You 2021 (10 workflows, mixtures with known labels): performance "consistently high and relatively stable", among
    the top 3 on one downstream ranking; Bruning 2022: gene sets similar to STARsolo and alevin-fry'
  gain_source: independent
  requires:
  - fastq
  caveats: 'Slowest of the common pipelines (STARsolo, alevin and kallisto >= 3x faster, kallisto 4-6x, Bruning 2022). Counts
    only sense reads confidently assigned to one gene, so gene-ambiguous reads are dropped. Calls cells by an order-of-magnitude
    UMI cut (m/10 of the 99th percentile of the expected top barcodes) followed by EmptyDrops for low-RNA barcodes, with a bounded
    candidate set (see [[emptydrops]]). Intronic reads counted by default from v7.0, which changes counts and calls compared
    with earlier versions. Outside human and mouse its extra cells were mostly low quality (Shainer 2021).'
  url: https://www.10xgenomics.com/support/software/cell-ranger
  repo: 10XGenomics/cellranger
  language: multiple
  doi: 10.1038/ncomms14049
  pmid: '28091601'
  cite_title: Massively parallel digital transcriptional profiling of single cells
  year: 2017
  verified: true
  papers:
  - pmid:35084033
  - pmid:34906205
  - pmid:34521337
  benchmarks: [bruning-2022-aligner-benchmark, you-2021-preprocessing-benchmark, shainer-2021-kallisto-cellranger]
  track: QC-sweep-A
  review: 11-quant-calling-ambient#cellranger
  tags:
  - 10x
  - droplet
  - best-practice
  - nuclei
- id: starsolo
  name: STARsolo
  kind: tool
  layer: core
  categories:
  - alignment-quantification
  - cell-calling
  side: neutral
  tier: benchmarked-sota
  summary: Single-cell mode built into the STAR aligner that does barcode and UMI correction, gene, intron-inclusive (GeneFull)
    and velocity counting, optional multi-gene read allocation and Cell Ranger-like cell filtering in one pass
  recovers: reads from genes with multi-mapping loci (EM or uniform allocation) that unique-only counting drops; intronic counts
    for nuclei
  gain: 'Kuijpers 2024 (8 SPLiT-seq pipelines): nearly identical to Parse splitpipe and one of two recommended; Du 2020: STAR
    detected more genes and agreed better with RNA-FISH than kallisto on Drop-seq, Fluidigm and 10x data; preprint: replicates
    Cell Ranger and is considerably faster (self-reported)'
  gain_source: independent
  requires:
  - fastq
  caveats: 'Uses more memory than lightweight mappers (~6.3x alevin-fry in the alevin-fry paper); default
    --soloCellFilter is the Cell Ranger 2.2 knee, and its EmptyDrops_CR mode hard-codes Cell Ranger limits (umiMin 500) so
    very low-RNA barcodes are never tested; multi-gene reads are discarded unless --soloMultiMappers is set; lacks random-hexamer
    read collapsing for SPLiT-seq (Kuijpers 2024); primary paper is a preprint.'
  url: https://github.com/alexdobin/STAR/blob/master/docs/STARsolo.md
  repo: alexdobin/STAR
  language: C++
  doi: 10.1101/2021.05.05.442755
  cite_title: 'STARsolo: accurate, fast and versatile mapping/quantification of single-cell and single-nucleus RNA-seq data'
  year: 2021
  verified: true
  papers:
  - pmid:35084033
  - pmid:32220951
  - pmid:38609853
  benchmarks: [bruning-2022-aligner-benchmark, du-2020-star-kallisto, kuijpers-2024-splitseq-pipelines]
  track: QC-sweep-A
  review: 11-quant-calling-ambient#starsolo
  tags:
  - preprint
