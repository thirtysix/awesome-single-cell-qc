- id: intronic-read-counting
  name: Counting intronic (nascent) reads, especially for nuclei
  kind: method
  layer: core
  categories:
  - alignment-quantification
  - cell-calling
  side: additive
  tier: standard
  summary: Counting reads that fall in introns towards the gene (Cell Ranger include-introns, default from v7.0; STARsolo GeneFull;
    alevin-fry splici/USA mode; kb nac index) instead of discarding them
  recovers: library size and genes in single-nucleus data, where much of the RNA is unspliced; cell types that exon-only counting
    blurs
  gain: 'Kuo 2024 (independent, 10x mouse cortex nuclei): exon-only references gave significantly smaller library sizes and
    discordant SingleR labels for astrocytes vs neural stem cells; Pool 2023: intronic read handling is one of three causes
    of missing genes in droplet data'
  gain_source: independent
  requires:
  - fastq
  caveats: 'Adds a gene-length bias, plausibly from internal priming in introns (Kuo 2024); in whole-cell data intron counts lowered
    cross-workflow correlation without improving clustering (You 2021). Switching it on changes UMI totals, so cell calling
    and QC thresholds from older runs no longer apply. The split into spliced, unspliced and ambiguous differs between tools
    (DFK index vs splici and spliceu references).'
  doi: 10.1093/biostatistics/kxad010
  pmid: '37257175'
  cite_title: Quantification and statistical modeling of droplet-based single-nucleus RNA-sequencing data
  year: 2024
  verified: true
  papers:
  - pmid:37697162
  - pmid:39657125
  - doi:10.1101/2023.01.04.522742
  track: QC-sweep-A
  review: 11-quant-calling-ambient#intronic-read-counting
  tags:
