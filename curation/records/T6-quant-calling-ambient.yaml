  - multimapping
  - velocity
  - split-pool
- id: alevin-fry
  name: alevin-fry / simpleaf (salmon alevin successor)
  kind: tool
  layer: core
  categories:
  - alignment-quantification
  - cell-calling
  side: neutral
  tier: benchmarked
  summary: Lightweight mapping (pseudoalignment with structural constraints or selective alignment) to a spliced plus intronic
    (splici) reference, with EM resolution of gene-ambiguous UMIs and spliced, unspliced and ambiguous counts in one run; simpleaf
    wraps it
  recovers: gene-ambiguous UMIs allocated by EM rather than discarded; nascent counts for nuclei and velocity from the same run
  gain: 'You 2021: among the top 3 workflows (with Cell Ranger) on one downstream ranking, > 50x faster than dropSeqPipe at
    600M reads; self-reported (simulated 10x): mean relative false-positive expression per cell 0.011 with splici vs 0.328
    for kallisto|bustools on a spliced-only index; ~2.6x faster and ~6.3x less memory than STARsolo'
  gain_source: independent
  requires:
  - fastq
  caveats: 'Kuijpers 2024: on SPLiT-seq its downstream results were "difficult to interpret". You 2021: retained more biological
    noise among lowly expressed features and pseudogenes. The original salmon alevin used a putative whitelist that let
    through low-UMI barcodes absent from the 10x whitelist and found ~50% of the cardiac endothelial cells other tools found
    (Bruning 2022). Default cell filtering (knee) is permissive or strict depending on the mode chosen; QCatch (PMID 41987571)
    adds cell calling and QC reports.'
  url: https://alevin-fry.readthedocs.io
  repo: COMBINE-lab/alevin-fry
  language: Rust
  doi: 10.1038/s41592-022-01408-3
  pmid: '35277707'
  cite_title: Alevin-fry unlocks rapid, accurate and memory-frugal quantification of single-cell RNA-seq data
  year: 2022
  verified: true
  papers:
  - pmid:37802884
  - pmid:30917859
  - doi:10.1101/2023.01.04.522742
  - pmid:41987571
  benchmarks: [bruning-2022-aligner-benchmark, you-2021-preprocessing-benchmark, kuijpers-2024-splitseq-pipelines]
  track: QC-sweep-A
  review: 11-quant-calling-ambient#alevin-fry
