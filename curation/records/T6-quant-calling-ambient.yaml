- id: optimus
  name: Optimus (HCA / WARP pipeline)
  kind: tool
  layer: core
  categories:
  - alignment-quantification
  side: neutral
  tier: benchmarked
  summary: Human Cell Atlas WDL pipeline for 10x data, STARsolo-based in current versions (multi-mappers allocated Uniform
    by default), that returns count matrices with emptyDrops results (lower bound 100 UMIs) and QC metrics attached rather
    than a pre-filtered matrix
