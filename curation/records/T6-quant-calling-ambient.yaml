# ------------------------------------------------------------------ cell calling
- id: knee-cell-calling
  name: Knee / inflection-point cell calling (barcodeRanks, Cell Ranger 2 style)
  kind: method
  layer: core
  categories:
  - cell-calling
  side: subtractive
  tier: standard
  summary: Keeps barcodes above the knee or inflection of the ranked total-UMI curve, or above a fraction of a high quantile
    of expected cells; the default in STARsolo, kb and many alevin-fry runs
  gain: none; simple and fast
  gain_source: none
  requires:
  - raw-matrix
  caveats: 'Cannot tell a small or RNA-poor cell from an empty droplet, so low-RNA types are lost ([[emptydrops]]); in nuclei
    data a quantile threshold kept debris (only 84.5% of passing droplets nuclear vs 95.7% with DIEM, 6 adipose samples, PMID
    32620816); the knee moves with intronic counting and depth, so the same sample processed two ways keeps different cells.'
  url: https://bioconductor.org/packages/DropletUtils
  track: QC-sweep-A
  review: 11-quant-calling-ambient#knee-cell-calling
  tags:
  - droplet
  - best-practice
- id: dropkick
  name: dropkick
  kind: tool
  layer: core
  categories:
  - cell-calling
  - qc-metrics-thresholds
  side: both
  tier: published-unbenchmarked
  summary: Trains a sparse logistic regression per sample on confident high- and low-quality barcodes from heuristic thresholds,
    then scores every barcode as cell or empty and low-quality
  recovers: real cells below a knee cut-off in rare populations, while dropping dead and empty barcodes
  gain: 'high-background simulations: specificity 0.9999 vs 0.9910 (Cell Ranger v2) and 0.9838 (EmptyDrops); colorectal inDrop
