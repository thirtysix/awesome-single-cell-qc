  side: neutral
  tier: published-unbenchmarked
  summary: Benchmark of 10 end-to-end preprocessing workflows (Cell Ranger, Optimus, salmon alevin, alevin-fry, kallisto bustools,
    dropSeqPipe, scPipe, zUMIs, celseq2, scruff) on CEL-Seq2 and 10x cell-line and tissue mixtures with known labels
