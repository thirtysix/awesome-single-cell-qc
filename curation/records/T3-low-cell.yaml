  - id: mrvi
    name: MrVI (multi-resolution variational inference)
    kind: tool
    layer: adjacent
    categories: [perturbation-models, de-pseudobulk]
    side: additive
    tier: published-unbenchmarked
    summary: "Deep generative model in scvi-tools with a sample-aware latent space that computes counterfactual cells to stratify samples and find cell-state-specific DE and differential abundance without predefined clusters"
    recovers: "Sample-level structure (which drugs or doses act alike) and local effects confined to cell subsets"
    gain: "On sci-Plex A549 (92 drugs x 4 doses as samples), MrVI sample distances agreed better with Connectivity Map drug similarity and placed doses of the same drug closer together than PCA- or scVI-based stratification"
    gain_source: self-reported
    requires: [multiple-conditions]
    caveats: "Requires training a neural network on all cells. Counterfactual DE is model-based, not a replicate-level test. With one well per drug-dose the 'sample' is the well, so drug and well effects are confounded. No independent benchmark found."
    url: https://docs.scvi-tools.org/en/stable/user_guide/models/mrvi.html
    repo: scverse/scvi-tools
    language: Python
    doi: 10.1038/s41592-025-02808-x
    pmid: "41083897"
    cite_title: "Deep generative modeling of sample-level heterogeneity in single-cell genomics."
    year: 2025
    verified: true
    qc_links:
      - {category: batch-and-plate-effects, effect: "Nuisance covariates such as plate are modelled apart from the target sample covariate, but only if plate is not confounded with drug"}
    track: T3
    review: 03-low-cell-stats#mrvi
    tags: [deep-generative, scvi-tools, sci-plex, drug-screen]

  - id: cpa
    name: CPA and chemCPA (compositional perturbation autoencoder)
    kind: tool
    layer: adjacent
    categories: [perturbation-models]
    side: additive
    tier: benchmarked
    summary: "Autoencoder that splits each cell into a basal latent state plus additive embeddings for perturbations and covariates, scaled by learned dose-response curves, to predict unseen doses, times and combinations; chemCPA adds molecular structure to reach unseen drugs"
    recovers: "Predicted responses for unmeasured drug-dose-combination conditions"
    gain: "Imputed 5,329 missing combinations (97.6% of all possibilities) in a combinatorial Perturb-seq screen and outperformed baseline models on unseen drug combinations in new A549 data"
    gain_source: self-reported
    requires: [multiple-conditions, doses-or-time]
    caveats: "The CPA paper assumes enough cells per condition to estimate the latent space with a large network. In the independent Ahlmann-Eltze 2025 benchmark CPA was particularly uncompetitive on double genetic perturbations (outside its design target). Predictions are not tests and carry no replicate-level uncertainty. scGen (2019) is the earlier latent-arithmetic model from the same group."
    url: https://cpa-tools.readthedocs.io/
    repo: theislab/cpa
    language: Python
    doi: 10.15252/msb.202211517
    pmid: "37154091"
    cite_title: "Predicting cellular responses to complex perturbations in high-throughput screens."
    year: 2023
    verified: true
    papers: ["doi:10.48550/arXiv.2204.13545", "pmid:31363220"]
    qc_links:
      - {category: low-cell-stats, effect: "Conditions with few cells give the network little to learn from; prediction quality for those conditions is the least certain"}
    benchmarks: [ahlmann-eltze-2025-perturbation-benchmark, li-2026-perturbation-models]
    track: T3
    review: 03-low-cell-stats#cpa
    tags: [deep-learning, drug-screen, combinations, preprint]

  - id: ahlmann-eltze-2025
    name: "Ahlmann-Eltze et al. 2025: deep perturbation models vs linear baselines"
    kind: evidence
    layer: adjacent
    categories: [perturbation-models, low-cell-stats]
    side: neutral
    tier: published-unbenchmarked
    summary: "Benchmark of five foundation models plus GEARS and CPA against 'no change', additive and linear baselines for predicting transcriptome changes after single and double genetic perturbations; none outperformed the baselines"
    gain: "On 62 held-out double perturbations every deep model had prediction error substantially higher than the additive baseline, and none beat the 'no change' baseline at finding genetic interactions"
    gain_source: independent
    caveats: "Disputed: Miller 2026 (Nat Biotechnol) argues common metrics such as MSE and Pearson delta are miscalibrated and that deep models can beat uninformative baselines on calibrated metrics across 14 datasets. Csendes 2025 and Wong 2025 also found simple baselines ahead. Li 2026 (13 methods, 25 datasets incl. two drug-response sets): models compress variance and underestimate synergy; none generalised across cell types. All concern genetic or immune perturbations, not low-cell drug screens."
    url: https://doi.org/10.1038/s41592-025-02772-6
    doi: 10.1038/s41592-025-02772-6
    pmid: "40759747"
    cite_title: "Deep-learning-based gene perturbation effect prediction does not yet outperform simple linear baselines."
    year: 2025
    verified: true
    papers: ["pmid:40269681", "pmid:40407144", "pmid:42823510", "pmid:42715312", "pmid:37592036"]
    qc_links:
      - {category: low-cell-stats, effect: "With few cells per condition, additive or linear baselines on pseudobulk effects are the reference any deep model must beat"}
    track: T3
    review: 03-low-cell-stats#ahlmann-eltze-2025
    tags: [benchmark, deep-learning, foundation-models, dispute]

  - id: mixscape
    name: Mixscape (and perturbation-response scores)
    kind: tool
    layer: adjacent
    categories: [perturbation-models, low-cell-stats]
    side: additive
    tier: standard
    summary: "Computes a local perturbation signature per cell by subtracting the mean of its 20 nearest control neighbours, then uses a mixture model to classify targeted cells as perturbed or non-perturbed before DE"
    recovers: "Effects diluted by non-responding cells; variation from replicate, cell cycle and stress removed from the signature"
    gain: "In the ECCITE-seq screen, 115 of 278 cells carrying an IFNGR2 gRNA appeared to escape perturbation; signatures substantially reduced replicate, cell-cycle and stress variation"
    gain_source: self-reported
    requires: [multiple-conditions]
    caveats: "Built for CRISPR, where escape is near-binary; drug responses are graded, which the perturbation-response score of Song 2025 models instead. Testing only on 'responders' inflates effect sizes and is circular unless the classification uses separate data. Needs enough cells per perturbation to fit the mixture."
    url: https://satijalab.org/seurat/articles/mixscape_vignette
    repo: satijalab/seurat
    language: multiple
    doi: 10.1038/s41588-021-00778-2
    pmid: "33649593"
    cite_title: "Characterizing the molecular regulation of inhibitory immune checkpoints with multimodal single-cell screens."
    year: 2021
    verified: true
    papers: ["pmid:40011559"]
    qc_links:
      - {category: cell-cycle-and-stress, effect: "The local signature subtracts matched control neighbours, removing cell-cycle and stress states shared with controls"}
    track: T3
    review: 03-low-cell-stats#mixscape
    tags: [responders, crispr, pertpy]

