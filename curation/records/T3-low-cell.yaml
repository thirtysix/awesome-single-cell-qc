  # ---------------------------------------------------------------- imputation, latent and deep models

  - id: imputation-de-evidence
    name: Imputation and smoothing before DE (Andrews & Hemberg 2018; Hou 2020)
    kind: evidence
    layer: adjacent
    categories: [de-pseudobulk, low-cell-stats]
    side: neutral
    tier: published-unbenchmarked
    summary: "Evaluations showing that imputation and smoothing (MAGIC, kNN-smoothing, DCA, SAVER, scImpute, DrImpute and others) create false-positive DE and correlations and mostly erase small effects"
    gain: "Hou 2020 (18 methods): with large DE, 13 of 16 methods raised overlap with bulk DEGs; with small DE, only 2 of 16 did. Andrews & Hemberg: MAGIC, knn-smooth and DCA produced many false positives; SAVER was least likely to"
    gain_source: independent
    requires: [filtered-matrix]
    caveats: "Imputation reuses the data's own structure, so tests on imputed values are circular. Recommendation from both studies: test on un-imputed counts; use imputation for visualisation only."
    url: https://doi.org/10.12688/f1000research.16613.2
    doi: 10.12688/f1000research.16613.2
    pmid: "30906525"
    cite_title: "False signals induced by single-cell imputation."
    year: 2018
    verified: true
    papers: ["pmid:32854757"]
    qc_links:
      - {category: qc-metrics-thresholds, effect: "Imputation does not make low-count cells kept by permissive QC safe to test; it spreads neighbour signal into them"}
    track: T3
    review: 03-low-cell-stats#imputation-de-evidence
    tags: [imputation, denoising, false-positives]

  - id: scvi-de
    name: scVI differential expression (lvm-DE)
    kind: tool
    layer: adjacent
    categories: [de-pseudobulk, low-cell-stats]
    side: additive
    tier: benchmarked
    summary: "Bayesian DE from scVI-family deep generative models: posterior log-fold-change estimates from the denoised model, with an empirical Bayes treatment of their uncertainty"
    recovers: "Denoised, depth-corrected effect estimates for sparse genes"
    gain: "Outperformed state-of-the-art methods at estimating log fold change and detecting DE genes between cell subpopulations"
    gain_source: self-reported
    requires: [filtered-matrix]
    caveats: "Compares groups of cells; sample-level replication is not modelled (MrVI adds that). The independent nested benchmark of Hafner 2025 found single-cell-specific methods including scVI no better than pseudobulk DESeq2 on individual datasets, and slower."
    url: https://docs.scvi-tools.org/en/stable/user_guide/models/scvi.html
