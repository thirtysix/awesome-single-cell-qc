    papers: ["pmid:29295995", "pmid:31340985", "pmid:37843125", "pmid:32051003"]
    track: T3
    review: 03-low-cell-stats#decoupler
    tags: [signatures, pathways, transcription-factors, drug-screen]

  - id: signature-scoring-evidence
    name: Gene-set scoring benchmarks (cell-level and pseudobulk)
    kind: evidence
    layer: core
    categories: [low-cell-stats]
    side: neutral
    tier: published-unbenchmarked
    summary: "Benchmarks of gene-set and pathway scoring methods (AUCell, UCell, ssGSEA, GSVA, z-score, Pagoda2, PLAGE, JASMINE) showing that method choice changes the size and even the sign of program scores"
    gain_source: none
    requires: [filtered-matrix]
    caveats: "Zhang 2020: Pagoda2 best overall of 7 tools on 32 datasets, PLAGE most stable. Noureen 2022 (JASMINE): bulk-style scorers are biased by the number of detected genes per cell. PathwayBench (Research Square preprint, 8 pseudobulked case-control datasets, 682 donors): rank-based AUCell and UCell inverted the sign in 40% of simulated replicates under high competitor burden; no method met all five criteria."
    url: https://doi.org/10.1016/j.csbj.2020.10.007
