  # --- Cells, depth and replicates -----------------------------------------------------------------
  - id: scperturb
    name: scPerturb
    kind: evidence
    layer: core
    categories: [screen-design, low-cell-stats]
    side: neutral
    tier: published-unbenchmarked
    summary: "Harmonised collection of 44 single-cell perturbation datasets with energy-distance statistics, used to derive cells-per-perturbation and depth guidelines"
    gain: "Significant perturbations fell as cells per perturbation were subsampled, and significance saturated near 500 UMIs per cell; guideline of at least 200-500 cells per perturbation and about 1,000 UMIs per cell; sci-Plex 3: 107 of 188 drugs significant by E-test"
    gain_source: independent
    requires: [multiple-conditions]
    caveats: "The guideline targets distinguishing a perturbation from control by E-test, a stricter goal than estimating a mean shift (MIX-Seq found tens of cells enough for that); E-distance itself grows as cells fall, so compare conditions at equal cell numbers"
    repo: sanderlab/scPerturb
    language: Python
    doi: 10.1038/s41592-023-02144-y
    pmid: "38279009"
    cite_title: "scPerturb: harmonized single-cell perturbation data"
    year: 2024
    verified: true
    track: T4
    review: 04-screen-design#scperturb
    tags: [perturbation, resource, power, depth]

  - id: scpower
    name: scPower
    kind: tool
    layer: core
    categories: [screen-design, low-cell-stats]
    side: neutral
    tier: published-unbenchmarked
    summary: "R package and web tool that models detection power for multi-sample DE and eQTL designs from samples, cells per sample and reads per cell under a budget, including overloading-induced doublets"
    recovers: "power per unit budget by choosing samples, cells and depth together"
    gain: "Across platforms, shallow sequencing of many cells gave higher overall power than deep sequencing of fewer cells; with doublet detection, overloading lanes increased power despite discarding doublets"
    gain_source: self-reported
    requires: [replicates]
    caveats: "Built for comparisons between individuals (donors as replicates), not drug-by-line grids; its doublet model is a lower bound on observed rates; priors come from PBMC data unless re-fitted; Mandric 2020 reached the same more-samples-lower-depth conclusion for cell-type eQTL"
    repo: heiniglab/scPower
    language: R
    doi: 10.1038/s41467-021-26779-7
    pmid: "34785648"
    cite_title: "scPower accelerates and optimizes the design of multi-sample single cell transcriptomic studies"
