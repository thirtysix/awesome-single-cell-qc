  # --- Fixation and storage ------------------------------------------------------------------------
  - id: methanol-fixation
    name: Methanol fixation
    kind: design
    layer: core
    categories: [screen-design, damaged-cells]
    side: additive
    tier: benchmarked-sota
    summary: "Dissociated cells are fixed in 80% methanol and stored, then rehydrated for droplet scRNA-seq, which separates harvest from capture"
    recovers: "cells and states that would degrade while samples wait, including low-RNA cells after storage"
    gain: "Independent (Gutierrez-Franco 2023): on hiPSC-derived neural cells methanol kept cell composition closest to fresh with little expression bias, while DMSO cryopreservation shifted composition and induced stress and apoptosis genes; self-reported (Alles 2017): unchanged genes and UMIs per cell in human-mouse mixtures after storage for weeks"
    gain_source: independent
    caveats: "Wohnhaas 2019 preferred DMSO cryopreservation for other cell types, so the best choice depends on cell type; DMSO cryopreservation gave the highest library complexity in the neural comparison"
    doi: 10.1186/s12915-017-0383-5
    pmid: "28526029"
    cite_title: "Cell fixation and preservation for droplet-based single-cell transcriptomics"
    year: 2017
    verified: true
    papers: ["doi:10.1038/s42003-023-04834-x", "doi:10.1038/s41598-019-46932-z"]
    benchmarks: [gutierrez-franco-2023-preservation, wohnhaas-2019-preservation, denisenko-2020-dissociation-storage]
    track: T4
    review: 04-screen-design#methanol-fixation
    tags: [fixed, preservation, methanol]

  - id: dsp-fixation
    name: DSP reversible fixation
    kind: design
    layer: core
    categories: [screen-design, damaged-cells]
    side: additive
    tier: published-unbenchmarked
    summary: "Reversible amine crosslinking with DSP (Lomant's reagent) stabilises single cells for later RNA-seq and is undone with a reducing agent"
    recovers: "the treated state at the moment of fixation, and a viability record because fixed cells keep propidium iodide"
    gain: "K562 cells: fresh against fixed bulk r above 0.93; fixed replicates stored 3 or 7 days r about 0.97, comparable to fresh replicates; less cell-to-cell variation in cDNA yield than fresh cells"
    gain_source: self-reported
    caveats: "Slightly lower cDNA yield and a detectable 3' bias; shown on the Fluidigm C1, later adopted in optimised sci-RNA-seq3 (DSP/methanol) and FixNCut"
    doi: 10.1038/s41598-018-20372-7
    pmid: "29391536"
    cite_title: "A practical solution for preserving single cells for RNA sequencing"
    year: 2018
    verified: true
    track: T4
