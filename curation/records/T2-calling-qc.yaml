- id: cb2
  name: CB2 (scCB2)
  kind: tool
  layer: core
  categories:
  - cell-calling
  side: additive
  tier: published-unbenchmarked
  summary: Extends EmptyDrops by clustering similar barcodes before testing them against the ambient profile, which raises
    power for small cells
  recovers: extra real cells, mostly in existing populations
  gain: 24% more cells than EmptyDrops on average (range 4-81%), 88% of the extra cells joining existing subpopulations; +18%
