  kind: evidence
  layer: core
  categories:
  - ambient-rna
  - qc-benchmarks
  side: neutral
  tier: published-unbenchmarked
  summary: Independent benchmark of seven ambient RNA removal methods on simulated, species-mixing, genotype-mixing and contamination-free
    control data
  gain: 7 datasets, 64 samples, 135,561 cells; 81.56% of cells carry some ambient RNA (mean 7.79% of UMIs in cells, 11.80%
