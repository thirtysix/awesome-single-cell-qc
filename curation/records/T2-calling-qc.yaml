- id: soupx
  name: SoupX
  kind: tool
  layer: core
  categories:
  - ambient-rna
  side: both
  tier: standard
  summary: Estimates a per-channel ambient (soup) profile from empty droplets and a contamination fraction from genes that
    should be absent, then subtracts the soup from each cell
  recovers: specificity of marker and response genes in kept cells, so cells need not be dropped for ambient-driven mixed
    profiles
  gain: 'Nie 2026: second-lowest error and smallest variance for absolute contamination across contamination levels; Cargnelli
    2026: reduced mode (filtered matrix only) is one of three recommended methods and less prone than CellBender or DecontX
    to over-correct samples without ambient RNA; Schroeder 2026 (preprint): reliable removal with minimal count distortion'
  gain_source: independent
  requires:
  - raw-matrix
  caveats: 'One contamination fraction per channel by design, so it underestimates and cannot capture cell-to-cell variation
    (Janssen 2023: Slc34a1 outside PT only 60% -> 54%); automated mode can miss strong contaminating genes (scCDC 2024). Running
    it before doublet detection lowered doublet recall (Meier 2026, preprint).'
  url: https://github.com/constantAmateur/SoupX
  repo: constantAmateur/SoupX
  language: R
  doi: 10.1093/gigascience/giaa151
  pmid: '33367645'
