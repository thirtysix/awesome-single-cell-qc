- id: xi-li-2021
  name: Xi & Li 2021 doublet-detection benchmark
  kind: evidence
  layer: core
  categories:
  - doublets
  - qc-benchmarks
  side: neutral
  tier: published-unbenchmarked
  summary: Benchmark of nine RNA-based doublet detectors on 16 real datasets with experimentally annotated doublets and 112
    synthetic datasets
  gain: DoubletFinder had the best detection accuracy and cxds the highest efficiency; no method was best everywhere; Solo had
    the highest mean AUROC; Solo and hybrid were the only methods to beat the library-size and gene-count baselines on all 16
    datasets, and doubletCells did not beat them on most; doublets made spurious Slingshot branches in simulations, removed
    by every detector except doubletCells, and doublet removal by most methods improved DE gene and temporally DE gene recovery;
    the protocol extension (STAR Protocols 2021) found scDblFinder best on mean AUPRC and AUROC
  gain_source: independent
  caveats: Annotated doublets come from hashing or genotypes, which miss same-sample homotypic doublets.
  doi: 10.1016/j.cels.2020.11.008
  pmid: '33338399'
  cite_title: Benchmarking Computational Doublet-Detection Methods for Single-Cell RNA Sequencing Data
