- id: mitochontrol
  name: MitoChontrol
  kind: tool
  layer: core
  categories:
  - qc-metrics-thresholds
  - damaged-cells
  side: both
  tier: published-unbenchmarked
  summary: Fits a Gaussian mixture to the mito fraction within each transcriptionally coherent cluster and sets a cluster-specific
    cut where the posterior probability of compromise exceeds a chosen level
  recovers: viable cell populations with elevated mito fraction
  gain: on HEK293 data with mtRNA inflated in 10% of cells it removed the inflated subset and kept the baseline; ddqc kept
    many inflated cells (qualitative, self-reported)
  gain_source: self-reported
  requires:
  - filtered-matrix
  caveats: Preprint; no removal counts reported; depends on clustering; a global mito shift (all cells) is treated as biology,
    which is right for metabolic drugs but wrong if a whole condition is damaged.
  url: https://github.com/uttamLab/mitochontrol
