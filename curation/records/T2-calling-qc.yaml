- id: ddqc
  name: ddqc (data-driven QC)
  kind: tool
  layer: core
  categories:
  - qc-metrics-thresholds
  side: both
  tier: published-unbenchmarked
  summary: Clusters cells after minimal filtering, then applies MAD thresholds on genes, UMIs, mito and ribo fractions within
    each cluster
  recovers: cell types with high mito or low complexity (neutrophils, metabolically active parenchymal cells) that global
    cut-offs remove
  gain: retained a median 95.4% of input cells vs 69.4% with a fixed <200 genes / >10% mito cut-off ('over a third more cells')
  gain_source: self-reported
  requires:
