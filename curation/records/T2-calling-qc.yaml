- id: condition-aware-qc-audit
  name: Condition-aware QC audit (thresholds per cell type x batch, losses per condition)
  kind: hypothesis
  layer: core
  categories:
  - qc-metrics-thresholds
  - screen-design
  side: both
  tier: hypothesis
  summary: Set QC thresholds per cell type and batch (lane, plate), never per drug or dose, and tabulate cells removed by
    each QC step for every condition before any differential test
  recovers: cells of treatments that shift mito fraction or RNA content and would otherwise be removed at a treatment-dependent
    rate
  gain: none measured; drugs move the metrics QC relies on (paclitaxel and celecoxib repress global transcription per cell;
    mito fraction tracks drug resistance across CCLE lines)
  gain_source: none
  requires:
  - filtered-matrix
  - multiple-conditions
  - tag-counts
  caveats: Per-condition adaptive thresholds would normalise away a toxic drug's damage; a global fixed threshold removes
    cells at a rate the drug sets. Both bias pseudobulk comparisons; the loss table makes the bias visible.
