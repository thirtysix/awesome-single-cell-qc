- id: decontx
  name: DecontX (celda / decontX)
  kind: tool
  layer: core
  categories:
  - ambient-rna
  side: both
  tier: benchmarked-sota
  summary: Bayesian mixture model that splits each cell's counts into native and contaminating parts using cell clusters,
    optionally with the empty-droplet profile
  recovers: cell-level native counts without discarding cells; works when only a filtered matrix exists
  gain: 'Cargnelli 2026: the only method of seven that did not reduce cell-type recovery; Nie 2026: best preservation of per-cell
    contamination ranking (with scAR) and named most accurate contamination estimate in the abstract; Janssen 2023: Slc34a1
    outside PT 60% -> 2%; Schroeder 2026 (preprint): with scCDC, the only tool usable on non-droplet platforms without a raw
    matrix'
  gain_source: independent
  requires:
  - filtered-matrix
  caveats: Default mode failed on one single-nucleus replicate (87% residual, Janssen 2023); under-corrects highly contaminating
    genes (scCDC 2024); over-corrects when no ambient is present in full mode (Cargnelli 2026); rank robustness falls with
    depth (Nie 2026). Correcting with decontX before doublet detection retained the largest share of doublets, because it
    removes proportionally more counts from doublets (Meier 2026, preprint).
  url: https://bioconductor.org/packages/decontX
  repo: campbio/decontX
  language: R
  doi: 10.1186/s13059-020-1950-6
  pmid: '32138770'
  cite_title: Decontamination of ambient RNA in single-cell RNA-seq with DecontX
  year: 2020
  verified: true
