- id: scdblfinder
  name: scDblFinder
  kind: tool
  layer: core
  categories:
  - doublets
  - multimodal
  side: subtractive
  tier: benchmarked-sota
  summary: Classifies cells against artificial doublets generated from cluster pairs with gradient-boosted trees, using the
    expected doublet rate as a prior
  recovers: singlets that a cruder doublet filter or a high-UMI cut-off would discard; cleaner clusters
  gain: 'Xi & Li 2021 protocol extension: highest mean AUPRC and AUROC on 16 real datasets with annotated doublets; singletCode
    2024 replicated it as best on those datasets'
  gain_source: independent
  requires:
  - filtered-matrix
  caveats: 'Targets heterotypic doublets (its vignette reports low performance on homotypic ones); on lineage-barcoded ground-truth
    singlets all detectors were weak (mean AUPRC 0.13-0.34) and scDblFinder lowest (singletCode 2024), so in single-line drug
    screens most doublets are homotypic and need tags or genotypes. Run per capture lane (vignette: doublets only arise within
    a capture). ATAC mode aggregates correlated peaks instead of selecting features; the authors compared it with AMULET on
    three snATAC datasets and offer a Fisher combination of the two (F1000 v2). Demuxafy 2024 found scDblFinder and Scrublet
    the detectors most affected by added ambient RNA. Call doublets before decontX or SoupX correction; ambient correction
    first lowered detection (Meier 2026, preprint).'
  url: https://bioconductor.org/packages/scDblFinder
  repo: plger/scDblFinder
  language: R
  doi: 10.12688/f1000research.73600.2
  pmid: '35814628'
