# Track T2: keeping cells at cell calling and QC; damaged cells.
# Hand-written layer; see docs/review/02-calling-qc-damaged.md.
records:
- id: emptydrops
  name: EmptyDrops (DropletUtils)
  kind: tool
  layer: core
  categories:
  - cell-calling
  - ambient-rna
  side: additive
  tier: standard
  summary: Calls cells by testing each barcode's profile against the ambient RNA profile estimated from low-count barcodes,
    so small low-RNA cells that differ from the soup are kept
  recovers: low-RNA cells and whole cell types that a total-UMI knee threshold discards
  gain: retained a putative interneuron cluster in ~900 brain cells and putative monocytes in placenta that the Cell Ranger
    v2 knee discarded; FDR among retained barcodes controlled at 0.1% (self-reported, simulations and real data)
  gain_source: self-reported
  requires:
  - raw-matrix
  caveats: Cell Ranger >= 3 runs an EmptyDrops-like second step, but its candidate set is bounded (the STARsolo EmptyDrops_CR
    emulation hard-codes umiMin 500 and umiMinFracMedian 0.01 as Cell Ranger values), so very low-RNA barcodes are never tested;
    DropletUtils defaults to lower = 100. In high-ambient samples it keeps empty and damaged droplets that need post-filtering
    (DropletQC found 0.4-9.5% cell-free droplets among EmptyDrops calls). Its result depends on the quantifier; on zUMIs and
    kallisto bustools output for a ~3,000-cell mixture it called ~60,000 cells (You 2021). In snRNA-seq of adipose tissue
    87.9% of its passing droplets were nuclear against 95.7% for DIEM, and it removed 1,038 and 782 nuclear droplets in two
    samples (DIEM paper, competitor); hashing-labelled AUROC 79.87% in the EmptyNN paper (competitor).
  url: https://bioconductor.org/packages/DropletUtils
  repo: MarioniLab/DropletUtils
  language: R
  doi: 10.1186/s13059-019-1662-y
  pmid: '30902100'
  cite_title: 'EmptyDrops: distinguishing cells from empty droplets in droplet-based single-cell RNA sequencing data'
  year: 2019
  verified: true
  papers:
  - pmid:34906205
  - pmid:32620816
  - pmid:34430929
  track: T2
  review: 02-calling-qc-damaged#emptydrops
  tags:
  - droplet
  - 10x
  - low-rna
  - starsolo
  - cellranger
- id: cellbender
  name: CellBender remove-background
  kind: tool
  layer: core
  categories:
  - ambient-rna
  - cell-calling
  side: both
  tier: benchmarked-sota
  summary: Deep generative model of droplet counts that calls cell-containing droplets, learns the ambient profile and returns
    background-subtracted counts
  recovers: marker specificity in kept cells and cells that would otherwise be dropped or mislabelled because of ambient signal
  gain: 'Janssen 2023 (genotype-mixed mouse kidney): most precise per-cell noise estimate; Slc34a1 detected in ~60% of non-PT
    cells raw, 7% after CellBender (SoupX 54%, DecontX 2%); Cargnelli 2026: best overall trade-off of ambient removal and
    endogenous retention; Nie 2026: top decontamination efficacy, robust to cell number and depth; Schroeder 2026 (preprint,
    6 tools, droplet and BD Rhapsody data): reliable removal with minimal count distortion; Meier 2026 (preprint): the only
    one of three ambient tools after which doublet detection was not worse than before correction'
  gain_source: independent
  requires:
  - raw-matrix
  caveats: Over-corrects when there is little or no ambient RNA (Cargnelli 2026); GPU strongly preferred; clustering gains
    are small and fine structure can be distorted (Janssen 2023); not independently benchmarked as a cell caller; in the
    EmptyNN paper (competitor) it kept 1,686 droplets against ~6,000 for other callers on genotype-labelled data (AUROC
    58.02%).
  url: https://cellbender.readthedocs.io
  repo: broadinstitute/CellBender
  language: Python
  doi: 10.1038/s41592-023-01943-7
  pmid: '37550580'
  cite_title: Unsupervised removal of systematic background noise from droplet-based single-cell experiments using CellBender
  year: 2023
  verified: true
  papers:
  - pmid:37337297
  - pmid:42688285
  - pmid:42844284
  - doi:10.64898/2026.04.08.717130
  - doi:10.64898/2026.10.13.758369
  benchmarks: [janssen-2023-background-noise, cargnelli-2026-ambient-benchmark, nie-2026-ambient-benchmark, schroeder-2026-ambient-benchmark,
