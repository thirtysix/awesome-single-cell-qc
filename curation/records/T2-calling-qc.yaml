- id: scar
  name: scAR (single-cell Ambient Remover)
  kind: tool
  layer: core
  categories:
  - ambient-rna
  side: both
  tier: benchmarked
  summary: Variational autoencoder that learns the ambient profile from empty droplets and denoises RNA, protein, guide and
    ATAC counts
  recovers: clean counts for RNA, CITE-seq and CRISPR guide assignments in kept cells
  gain: 'Cargnelli 2026: highest ambient-removal score (0.679 vs CellBender 0.604); Nie 2026: most robust across conditions
    and, with CellBender, highest decontamination efficacy'
  gain_source: independent
  requires:
  - raw-matrix
  caveats: Overestimates contamination (Nie 2026) and removed on average 0.445 of endogenous signal, mostly from low-expressed
    genes, hurting label transfer when no ambient was present (Cargnelli 2026); reassigned ~17% of cells to other types in
    one Nie 2026 dataset; preprint only. Created cell types absent from the raw data, 3 coarse types in BD Rhapsody and up
    to 8 in prefrontal cortex nuclei (Schroeder 2026, preprint).
  url: https://scar-tutorials.readthedocs.io
  repo: Novartis/scar
  language: Python
  doi: 10.1101/2022.01.14.476312
