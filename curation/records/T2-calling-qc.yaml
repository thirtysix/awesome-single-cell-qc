- id: mad-adaptive-qc
  name: MAD-based adaptive QC thresholds (scater/scuttle isOutlier, scanpy)
  kind: method
  layer: core
  categories:
  - qc-metrics-thresholds
  side: both
  tier: standard
  summary: Flags cells whose log counts, log genes, top-gene share or mito fraction lie several median absolute deviations
    from the median of their batch, instead of using fixed cut-offs
  recovers: cells that fixed thresholds remove in samples or cell types with atypical baselines
  gain: 'pipeComp: most clustering benefit is reached without stringent filtering; lenient rules (5 MADs, or 3 MADs on at
    least 2 metrics) limit loss of whole subpopulations'
  gain_source: independent
  requires:
  - filtered-matrix
  caveats: Computed on a mixed population it removes cell types with extreme but healthy values (pipeComp); thresholds computed
    per treatment follow the treatment. sc-best-practices uses 5 MADs plus mito > 3 MADs and > 8%. isOutlier and perCellQCMetrics
    now live in scuttle [[scuttle]]. Regressing out mito fraction or detected genes later is no substitute for QC, since in pipeComp
    it nearly always raised correlation with those covariates and lowered clustering accuracy.
  url: https://bioconductor.org/packages/scuttle
