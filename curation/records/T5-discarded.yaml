# --- Frameworks that model cell loss --------------------------------------------------------------------

  - id: unbalanced-ot-cell-loss
    name: Unbalanced optimal transport to model drug-induced cell loss
    kind: hypothesis
    layer: adjacent
    categories: [perturbation-models, discarded-data]
    side: additive
    tier: hypothesis
    summary: "Proposes carrying the growth and death terms of unbalanced optimal transport, which Waddington-OT estimates from proliferation and apoptosis signatures, into control-to-treated drug-response maps so that cell loss is modelled instead of ignored"
    recovers: "a response model in which killed cells count as part of the effect"
    requires: [filtered-matrix, multiple-conditions]
    caveats: "untested for drug screens; growth and death priors from signatures are weak in short exposures; balanced maps such as CellOT move all control mass onto the treated survivors"
    url: https://github.com/broadinstitute/wot
    repo: broadinstitute/wot
    language: Python
    doi: "10.1016/j.cell.2019.01.006"
    pmid: "30712874"
    cite_title: "Optimal-Transport Analysis of Single-Cell Gene Expression Identifies Developmental Trajectories in Reprogramming"
    year: 2019
    verified: true
    papers: ["pmid:39843746", "pmid:37770709"]
    qc_links:
      - {category: qc-metrics-thresholds, effect: "QC removal is indistinguishable from death in the transported mass unless retained fractions are reported per condition"}
      - {category: damaged-cells, effect: "damaged-cell calls could serve as an observed death term"}
    track: T5
    review: 05-discarded-data#unbalanced-ot-cell-loss
    tags: [optimal-transport, cell-death, perturbation-model, drug-screen]
