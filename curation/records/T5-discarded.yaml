# --- Empty droplets and hashtag negatives ------------------------------------------------------------

  - id: dsb
    name: dsb
    kind: tool
    layer: core
    categories: [discarded-data, ambient-rna]
    side: both
    tier: standard
    summary: "Normalises and denoises antibody-derived tag counts using protein levels in empty droplets as the ambient background and a per-cell technical component from isotype controls and background proteins"
    recovers: "cleaner protein signal, using empty droplets that are usually thrown away"
    requires: [raw-matrix, protein]
    caveats: "needs the raw matrix with empty droplets; empty-drop calls from RNA can include protein-rich cells such as neutrophils (DecontPro); included in the 14-method comparison of [[adtnorm]], which ADTnorm led (self-reported); titrating antibody concentrations cut background from a median 26.3% to 14.9% of UMIs [[buus-2021]], so some of what dsb removes can be prevented at the bench"
    url: https://github.com/niaid/dsb
    repo: niaid/dsb
    language: R
    doi: "10.1038/s41467-022-29356-8"
    pmid: "35440536"
    cite_title: "Normalizing and denoising protein expression data from droplet-based single cell profiling"
    year: 2022
    verified: true
    papers: ["pmid:37002403", "pmid:40595741", "pmid:33861199"]
    track: T5
    review: 05-discarded-data#dsb
    tags: [empty-droplets, citeseq, protein, ambient]

  - id: decontpro
    name: DecontPro
    kind: tool
    layer: core
    categories: [discarded-data, ambient-rna]
    side: both
    tier: published-unbenchmarked
    summary: "Bayesian hierarchical model that removes ambient and spongelet contamination from antibody-derived tag counts, after finding that some RNA-called empty droplets held high tag levels consistent with neutrophils"
    recovers: "protein-defined cells hidden among RNA-called empty droplets, and cleaner protein signal"
    requires: [raw-matrix, protein]
    caveats: "self-reported superiority; spongelets (medium-tag empty droplets) are a newly described artefact; recommends calling empty drops separately for RNA and tags"
    url: https://github.com/campbio/decontX
