# Benchmark studies: independent comparisons that records point at through their
# `benchmarks:` list. Hand-written, never generated. build.py fails if a record
# names an id that is not here. verify_citations.py checks each doi/pmid exactly
# as it checks records.
#
# One entry per study:
#   - id: xi-li-2021-doublet-benchmark      # lowercase slug, stable once used
#     name: Xi and Li 2021, doublet-detection benchmark
#     doi: 10.1016/j.cels.2020.11.008        # bare DOI
#     pmid: 33338399
#     cite_title: Benchmarking Computational Doublet-Detection Methods for Single-Cell RNA Sequencing Data
#     year: 2021
#     scope: what was compared, on what data
#     verified: true                          # only if doi/pmid fetched and title matched
# Optional: url, categories (schema category keys), notes.
#
# What counts (curation pass 2026-10-21): dedicated comparisons of several methods
# on shared data, pipelines or ensembles that benchmark existing tools (hadge,
# Demuxafy, Ensemblex), and ground-truth resources used to score methods
# (singletCode). A new method's own comparison against its competitors
# (deMULTIplex2, CMDdemux, HTOreader, demuxSNP, ULMnet, ADTnorm, valiDrops, ddqc,
# scQCenrich, MitoChontrol, Scanpro) is not listed; those results stay in the
# records' gain and caveats text. A record is linked only when the study's
# authors are independent of the record's authors (so pipeComp is not linked to
# scDblFinder). `notes` names the records that point at each study.
#
# Every entry below: PubMed esummary title and Crossref title for the DOI fetched
# on 2026-10-21 and matched; the DOI is the one PubMed lists for the PMID.
benchmarks:

  # ---------------------------------------------------------------- demultiplexing (T1, T4)

  - id: howitt-2023-hto-benchmark
    name: Howitt et al. 2023, hashtag demultiplexing benchmark
    doi: 10.1093/nargab/lqad086
    pmid: "37829177"
    cite_title: Benchmarking single-cell hashtag oligo demultiplexing methods
    year: 2023
    scope: "7 hashtag callers (hashedDrops, HTODemux, GMM-Demux, demuxmix, deMULTIplex, BFF raw and cluster, HashSolo) against vireo genotype calls in 6 tagging experiments: 24 BAL donors in 3 batches, 8 ovarian tumours in 2 batches, 3 lung cancer cell lines; antibody and lipid tags"
    categories: [demux-hashing, qc-benchmarks]
    verified: true
    notes: "demuxmix best overall; demuxmix, GMM-Demux and HTODemux close; hashedDrops with a lowered threshold best on F-score but with doublet errors; deMULTIplex and BFF poor on low-quality hashing. Evaluates: htodemux, hashsolo, hasheddrops, demuxmix, cellhashr, gmm-demux, multiseqdemux"

  - id: mylka-2022-hashing-comparison
    name: Mylka et al. 2022, antibody versus lipid hashing
    doi: 10.1186/s13059-022-02628-8
    pmid: "35172874"
    cite_title: Comparative analysis of antibody- and lipid-based multiplexing methods for single-cell RNA-seq
    year: 2022
    scope: "TotalSeq-A/B/C antibodies, MULTI-seq and custom lipid oligos, cholesterol oligos, anti-nucleoporin antibody nuclei hashing and CellPlex on cell lines, nuclei, PBMC and mouse tissues, scored against freemuxlet genotypes; callers MULTISeqDemux, HTODemux and GMM-Demux"
    categories: [demux-hashing, screen-design, qc-benchmarks]
    verified: true
    notes: "MULTISeqDemux slightly ahead of GMM-Demux and ahead of HTODemux on most datasets; antibodies best on cell lines, lipid or cholesterol oligos best on nuclei and mouse brain. Evaluates: multiseqdemux, htodemux, gmm-demux, cell-hashing, multi-seq, nucleus-hashing"

  - id: sayed-2025-hashtag-benchmark
    name: Sayed et al. 2025, tag normalisation x caller benchmark
    doi: 10.1093/bfgp/elae039
    pmid: "39387404"
    cite_title: Systematic benchmark of single-cell hashtag demultiplexing approaches reveals robust performance of a clustering-based method
    year: 2025
    scope: "18 workflows (4 tag normalisations x HTODemux, MULTIseqDemux and a clustering workflow, plus deMULTIplex2, demuxmix, GMM-Demux, hashedDrops, BFF raw and BFF cluster at defaults) on 12 real datasets with known labels and on simulations"
    categories: [demux-hashing, qc-benchmarks]
    verified: true
    notes: "The authors' clustering workflow with per-cell CLR ranked first by average F; deMULTIplex2 had the highest average F of the established standalone tools, followed by demuxmix and GMM-Demux (Fig. 5a); BFF, hashedDrops and default HTODemux ranked lowest. Evaluates: htodemux, multiseqdemux, demultiplex2, demuxmix, gmm-demux, hasheddrops, cellhashr"

  - id: curion-2024-hadge-comparison
    name: Curion et al. 2024 (hadge), hashing and genetic demultiplexer comparison
    doi: 10.1186/s13059-024-03249-z
    pmid: "38671451"
    cite_title: "hadge: a comprehensive pipeline for donor deconvolution in single-cell studies"
    year: 2024
    scope: "7 hashing callers (HTODemux, MULTI-seq, hashedDrops, demuxEM, GMM-Demux, BFF, HashSolo) on hashed multiple sclerosis brain nuclei matched to vireo donors; 5 genetic demultiplexers (demuxlet, freemuxlet, vireo, scSplit, souporcell) on 75 onek1k pools with known donor genotypes"
    categories: [demux-hashing, demux-genotype, qc-benchmarks]
    verified: true
    notes: "MULTI-seq and demuxEM matched vireo donors best; HashSolo called almost every droplet a singlet, hashedDrops 32 of 4 048; BFF ran but failed (also within cellhashR); demuxmix failed to initialise and was excluded. Vireo, demuxlet, freemuxlet and souporcell were the consistent genetic group, vireo best across downsampling, scSplit worst. Evaluates: htodemux, multiseqdemux, hasheddrops, demuxem, gmm-demux, cellhashr, hashsolo, demuxlet, vireo, souporcell"

  - id: brown-2024-multiplexing-reagents
    name: Brown et al. 2024, multiplexing reagents and fixed kits
    doi: 10.1016/j.ygeno.2024.110793
    pmid: "38220132"
    cite_title: A risk-reward examination of sample multiplexing reagents for single cell RNA-Seq
    year: 2024
    scope: "MULTI-seq lipids, hashtag antibodies and CellPlex on PBMC (4 donors, SNP truth), mouse embryonic brain and PDX; Cell Ranger multi and cellhashR callers; Parse Evercode and 10x Flex fixed kits on PDX nuclei"
    categories: [demux-hashing, screen-design, qc-benchmarks]
    verified: true
    notes: "Full text read from the bioRxiv version (10.1101/2023.06.20.544880). MULTI-seq had the best overall classification accuracy on PBMC, then antibodies, then CellPlex; BFF cluster best on the low signal-to-noise CellPlex set but four-fold more false positives on the high-quality MULTI-seq set; on PDX nuclei Parse was more reliable while Flex capture failed. Evaluates: cell-hashing, multi-seq, cellhashr, htodemux, split-seq-parse, 10x-flex"

  - id: fu-2025-snrna-genetic-benchmark
    name: Fu et al. 2025, genetic demultiplexing for snRNA-seq
    doi: 10.1093/bib/bbaf371
    pmid: "40702707"
    cite_title: Benchmarking of computational demultiplexing methods for single-nucleus RNA sequencing data
    year: 2025
    scope: "vireo, souporcell, freemuxlet and scSplit, each with BCFtools, cellSNP or FreeBayes variant calls, on simulated snRNA-seq pools of 2-6 samples at 0-30% doublets"
    categories: [demux-genotype, qc-benchmarks]
    verified: true
    notes: "Vireo most accurate and fastest; vireo and souporcell judged superior overall with little difference except run time; freemuxlet lower accuracy; scSplit worst. Evaluates: vireo, souporcell, demuxlet (freemuxlet)"

  - id: weber-2021-cancer-genetic-demux
    name: Weber et al. 2021, genetic demultiplexing in cancer
    doi: 10.1093/gigascience/giab062
    pmid: "34553212"
    cite_title: Genetic demultiplexing of pooled single-cell RNA-sequencing samples in cancer facilitates effective experimental design
    year: 2021
    scope: "cellSNP/vireo and demuxlet with several genotype references on in silico pools of high-grade serous ovarian cancer and lung adenocarcinoma scRNA-seq at 0-30% doublets"
    categories: [demux-genotype, qc-benchmarks]
    verified: true
    notes: "cellSNP/vireo with bulk RNA-seq genotypes best; demuxlet substantially lower and more sensitive to the SNP set. Evaluates: vireo, demuxlet"

  - id: neavin-2024-demuxafy-benchmark
    name: Neavin et al. 2024 (Demuxafy), genetic demultiplexer and doublet detector comparison
    doi: 10.1186/s13059-024-03224-8
    pmid: "38622708"
    cite_title: "Demuxafy: improvement in droplet assignment by integrating multiple single-cell demultiplexing and doublet detection methods"
    year: 2024
    scope: "7 genetic demultiplexers (Demuxalot, Demuxlet, Dropulation, Freemuxlet, scSplit, Souporcell, Vireo) and 7 doublet detectors (DoubletDecon, DoubletDetection, DoubletFinder, scDblFinder, scds, Scrublet, Solo) on 74 PBMC pools, fibroblast pools and 70 in silico pools of 2-128 donors"
    categories: [demux-genotype, doublets, qc-benchmarks]
    verified: true
    notes: "Demuxalot (refined) fewest wrong droplets and best heterogenic doublet calls; vireo best without reference genotypes at 16 or more donors; souporcell declined above 32 donors; scds, scDblFinder and Scrublet the top doublet detectors; DoubletDecon and DoubletFinder misclassified more singlets. Demuxafy (scds + DoubletFinder) beat Chord at 8 or more donors and was equivalent below. Evaluates: demuxalot, demuxlet, vireo, souporcell, scdblfinder, doubletdecon, doubletfinder, scds, scrublet, solo, doubletdetection, chord"

  - id: fiorini-2025-ensemblex-benchmark
    name: Fiorini et al. 2025 (Ensemblex), genetic demultiplexer comparison
    doi: 10.1186/s13059-025-03643-1
    pmid: "40611203"
    cite_title: "Ensemblex: an accuracy-weighted ensemble genetic demultiplexing framework for population-scale scRNAseq sample pooling"
    year: 2025
    scope: "Demuxalot, Demuxlet, scSplit, Souporcell and Vireo with genotypes on 96 in silico pools of 4-80 iPSC lines with whole-genome genotypes, plus experimentally pooled samples, against an ensemble of the four best"
    categories: [demux-genotype, qc-benchmarks]
    verified: true
    notes: "Demuxalot, Demuxlet, Souporcell and Vireo were the four best constituents, Demuxalot and Demuxlet highest in balanced accuracy; scSplit correctly classified 30.88% of cells. Evaluates: demuxalot, demuxlet, souporcell, vireo"

  # ---------------------------------------------------------------- ambient RNA, QC, doublets (T2, T5)

  - id: janssen-2023-background-noise
    name: Janssen et al. 2023, background noise and its removal
    doi: 10.1186/s13059-023-02978-x
    pmid: "37337297"
    cite_title: The effect of background noise and its removal on the analysis of single-cell expression data
    year: 2023
    scope: "CellBender, DecontX and SoupX against genotype-based background estimates in genotype-mixed mouse kidney scRNA-seq and snRNA-seq"
    categories: [ambient-rna, qc-benchmarks]
    verified: true
    notes: "CellBender gave the most precise noise estimates and the largest marker-gene improvement. Evaluates: cellbender, decontx, soupx"

  - id: cargnelli-2026-ambient-benchmark
    name: Cargnelli et al. 2026, ambient RNA decontamination benchmark
    doi: 10.3389/fbinf.2026.1844838
    pmid: "42688285"
    cite_title: Benchmarking computational decontamination of ambient RNA
    year: 2026
    scope: "CellBender, DecontX, FastCAR, scAR, scCDC, SoupX and CellClear on simulated, species-mixing, genotype-mixing and contamination-free control data (7 datasets, 64 samples)"
    categories: [ambient-rna, qc-benchmarks]
    verified: true
    notes: "No single best method; CellBender, DecontX and SoupX generally performed well and are recommended; scAR removed the most ambient RNA but also the most endogenous signal. Evaluates: cellbender, decontx, soupx, scar, fastcar, sccdc, cellclear"

  - id: nie-2026-ambient-benchmark
    name: Nie et al. 2026, ambient RNA decontamination benchmark
    doi: 10.1038/s41467-026-77458-4
    pmid: "42844284"
    cite_title: Systematic benchmarking of ambient RNA decontamination tools to advance precision in single-cell transcriptomic analysis
    year: 2026
    scope: "DecontX, SoupX, scAR, CellBender, FastCAR, scCDC and CellClear scored on accuracy (mtDNA-variant baseline), robustness (contamination level, cell number, depth, tissue) and subtype sensitivity"
    categories: [ambient-rna, qc-benchmarks]
    verified: true
    notes: "Task-dependent: DecontX top composite accuracy; CellBender and FastCAR best absolute contamination estimates; scAR most robust and best for embeddings and marker specificity but overestimates; SoupX recommended for comparing libraries; CellClear best for subtypes. Evaluates: cellbender, decontx, soupx, scar, fastcar, sccdc, cellclear"

  - id: germain-2020-pipecomp
    name: Germain et al. 2020 (pipeComp), preprocessing pipeline benchmark
    doi: 10.1186/s13059-020-02136-7
    pmid: "32873325"
    cite_title: pipeComp, a general framework for the evaluation of computational pipelines, reveals performant single cell RNA-seq preprocessing tools
    year: 2020
    scope: "Filtering (MAD thresholds at four stringencies, PCA-based outliers), doublet detection, normalisation, feature selection and clustering on mixtures and simulations with known identities"
    categories: [qc-benchmarks, qc-metrics-thresholds, doublets, normalisation, feature-selection, clustering-annotation]
    verified: true
    notes: "Stringent global MAD filtering removed subpopulations with extreme but healthy values without improving clustering; lenient cut-offs recommended. scDblFinder was also evaluated but shares an author with pipeComp, so it is not linked. sctransform best for separability and removing library-size and detection-rate effects; regressing out detection rate or mito proportion nearly always lowered clustering accuracy; deviance best feature ranking, more features helpful up to about 4,000. Evaluates: mad-adaptive-qc, sctransform, scran-pooling, townes-2019"

  - id: xi-li-2021-doublet-benchmark
    name: Xi and Li 2021, doublet-detection benchmark
    doi: 10.1016/j.cels.2020.11.008
    pmid: "33338399"
    cite_title: Benchmarking Computational Doublet-Detection Methods for Single-Cell RNA Sequencing Data
    year: 2021
    scope: "9 doublet detectors (doubletCells, cxds, bcds, hybrid, Scrublet, Solo, DoubletDetection, DoubletFinder, DoubletDecon) on 16 real datasets with experimentally annotated doublets and 112 synthetic datasets"
    categories: [doublets, qc-benchmarks]
    verified: true
    notes: "DoubletFinder best accuracy, cxds fastest; DoubletDecon gives no score, did not beat library-size or gene-count baselines and failed on several datasets. Evaluates: doubletdecon, doubletfinder, scrublet, scds, solo, doubletdetection, doubletcells"

  - id: xi-li-2021-doublet-protocol
    name: Xi and Li 2021, doublet-detection benchmark protocol (scDblFinder added)
    doi: 10.1016/j.xpro.2021.100699
    pmid: "34382023"
    cite_title: Protocol for executing and benchmarking eight computational doublet-detection methods in single-cell RNA sequencing data analysis
    year: 2021
    scope: "The Xi and Li benchmark re-run through DoubletCollection with scDblFinder added (Scrublet, doubletCells, cxds, bcds, hybrid, DoubletDetection, DoubletFinder, scDblFinder) on the same 16 real datasets with annotated doublets"
    categories: [doublets, qc-benchmarks]
    verified: true
    notes: "scDblFinder had the highest mean AUPRC and AUROC on the 16 real datasets. Evaluates: scdblfinder, doubletfinder, scrublet, scds, doubletdetection, doubletcells"

  - id: zhang-2024-singletcode
    name: Zhang et al. 2024 (singletCode), doublet detectors on barcoded ground truth
    doi: 10.1016/j.xgen.2024.100592
    pmid: "38925122"
    cite_title: Synthetic DNA barcodes identify singlets in scRNA-seq datasets and evaluate doublet algorithms
    year: 2024
    scope: "DoubletFinder, scDblFinder, hybrid and Scrublet scored on ground-truth singlets from lineage-barcoded datasets (mostly cell lines) and on the Xi and Li non-barcoded datasets"
    categories: [doublets, qc-benchmarks]
    verified: true
    notes: "Mean AUPRC 0.13-0.34 on barcoded data with scDblFinder considerably lower than the others; scDblFinder best on the non-barcoded datasets. Chord was run on 12 samples from 3 datasets; the ensembles (hybrid, Chord) did not always beat their components. Evaluates: scdblfinder, doubletfinder, scds, scrublet, chord"

  - id: ttoouli-2025-multiplets
    name: Ttoouli and Hoffmann 2025, multiplet detection against cell hashing
    doi: 10.1371/journal.pone.0333687
    pmid: "41166377"
    cite_title: "Multiplets in scRNA-seq data: Extent of the problem and efficacy of methods for removal"
    year: 2025
    scope: "cxds, bcds, hybrid, doubletCells, DoubletDetection, DoubletFinder, scDblFinder and Scrublet with tuned parameters, scored against cell-hashing multiplets in public hashed datasets"
    categories: [doublets, qc-benchmarks]
    verified: true
    notes: "The authors call it not a benchmarking study, but it scores several tools on shared data against hashing truth. Scrublet best by AUROC; DoubletDetection, scDblFinder and DoubletFinder the top performers across metrics; all missed most hashing multiplets; the 10x multiplet-rate rule underestimated hashing multiplets. Evaluates: scdblfinder, doubletfinder, scrublet, scds, doubletdetection, doubletcells, expected-doublet-rate"

  # ---------------------------------------------------------------- differential expression and few cells (T3)

  - id: squair-2021-de-benchmark
    name: Squair et al. 2021, single-cell differential expression against matched bulk
    doi: 10.1038/s41467-021-25960-2
    pmid: "34584091"
    cite_title: Confronting false discoveries in single-cell differential expression
    year: 2021
    scope: "14 DE methods (pseudobulk edgeR, DESeq2 and limma variants; cell-level tests) on 18 gold-standard datasets with matched bulk RNA-seq, plus null comparisons, pseudo-replicates and mixed models (GLMMs adapted from muscat's implementations) on downsampled data"
    categories: [low-cell-stats, de-pseudobulk, qc-benchmarks]
    verified: true
    notes: "All six top methods were pseudobulk; cell-level methods called hundreds of false DE genes; random-cell pseudo-replicates reintroduced the bias. Evaluates: pseudobulk-de, muscat, cell-subsample-pseudoreplicates"

  - id: junttila-2022-ds-benchmark
    name: Junttila et al. 2022, multi-subject differential state benchmark
    doi: 10.1093/bib/bbac286
    pmid: "35880426"
    cite_title: Benchmarking methods for detecting differential states between conditions from multi-subject single-cell RNA-seq data
    year: 2022
    scope: "18 methods (6 pseudobulk; mixed models MAST_RE, muscat_MM, NEBULA-LN; naive and latent-variable cell-level tests) on muscat simulations, reference-free simulations and mock comparisons of real PBMC data"
    categories: [low-cell-stats, de-pseudobulk, qc-benchmarks]
    verified: true
    notes: "Pseudobulk methods performed best and outperformed the mixed models; MAST_RE slightly ahead of NEBULA-LN, muscat_MM inferior on all four data types. Evaluates: pseudobulk-de, muscat, nebula"

  - id: gagnon-2022-de-benchmark
    name: Gagnon et al. 2022, multi-subject DE benchmark
    doi: 10.3390/life12060850
    pmid: "35743881"
    cite_title: Recommendations of scRNA-seq Differential Gene Expression Analysis Based on Comprehensive Benchmarking
    year: 2022
    scope: "12 DE methods (8 pseudobulk including edgeR, limma-voom and DESeq2 variants; glmmTMB, NEBULA-HL, NEBULA-LN, MAST) on data from the authors' multi-subject, multi-condition simulator and two real datasets"
    categories: [low-cell-stats, de-pseudobulk, qc-benchmarks]
    verified: true
    notes: "Negative binomial mixed models (glmmTMB, NEBULA-HL) outperformed the others; pseudobulk methods were conservative. Simulator built by the same authors. Evaluates: pseudobulk-de, nebula"

  - id: hafner-2025-nested-de-benchmark
    name: Hafner et al. 2025, DE in nested single-cell settings
    doi: 10.1093/bib/bbaf397
    pmid: "40794957"
    cite_title: Single-cell differential expression analysis between conditions within nested settings
    year: 2025
    scope: "Pseudobulk DESeq2, permutation test and DREAM, cell-level MAST, scVI, distinct, t-test and hierarchical bootstrapping on splatPop simulations and experimental data with Reactome genes as truth"
    categories: [low-cell-stats, de-pseudobulk, qc-benchmarks]
    verified: true
    notes: "Single-cell-specific methods gave no advantage over pseudobulk DESeq2 on individual datasets and ran longer; scVI agreed poorly with the others; permutation best at atlas level, DREAM a compromise. Evaluates: pseudobulk-de, scvi-de"

  - id: hou-2020-imputation-benchmark
    name: Hou et al. 2020, scRNA-seq imputation benchmark
    doi: 10.1186/s13059-020-02132-x
    pmid: "32854757"
    cite_title: A systematic evaluation of single-cell RNA-sequencing imputation methods
    year: 2020
    scope: "18 imputation methods scored against bulk profiles and on downstream DE, clustering and trajectories, using cell lines and tissues from plate- and droplet-based platforms"
    categories: [de-pseudobulk, low-cell-stats, qc-benchmarks]
    verified: true
    notes: "Most methods recovered bulk-like profiles but did not improve downstream analyses; small DE effects were smoothed away. No record is a method it evaluated (see imputation-de-evidence)"

  - id: andrews-hemberg-2018-imputation
    name: Andrews and Hemberg 2018, false signals from imputation
    doi: 10.12688/f1000research.16613.2
    pmid: "30906525"
    cite_title: False signals induced by single-cell imputation
    year: 2018
    scope: "Six imputation methods (including MAGIC, knn-smooth, DCA and SAVER) on simulated data and permuted real scRNA-seq, scored on false-positive and irreproducible DE and correlations"
    categories: [de-pseudobulk, qc-benchmarks]
    verified: true
    notes: "Smoothing methods (MAGIC, knn-smooth, DCA) generated many false positives; SAVER least likely to. No record is a method it evaluated (see imputation-de-evidence)"

  - id: zhang-2020-pathway-activity-benchmark
    name: Zhang et al. 2020, pathway activity scoring benchmark
    doi: 10.1016/j.csbj.2020.10.007
    pmid: "33209207"
    cite_title: Benchmarking algorithms for pathway activity transformation of single-cell RNA-seq data
    year: 2020
    scope: "7 pathway activity transformation tools on 32 datasets from 16 scRNA-seq protocols, scored on accuracy, stability and scalability"
    categories: [low-cell-stats, qc-benchmarks]
    verified: true
    notes: "Pagoda2 best overall, PLAGE most stable. No record is a method it evaluated (see signature-scoring-evidence)"

  - id: alakwaa-2026-pathwaybench
    name: Alakwaa et al. 2026 (PathwayBench), pseudobulk pathway scoring benchmark
    doi: 10.21203/rs.3.rs-10271634/v1
    pmid: "42466400"
    cite_title: "PathwayBench: a multi-criterion benchmark of pseudobulk pathway activity scoring methods reveals rank-window competition as a mechanism of biological signal loss in single-cell RNA-seq"
    year: 2026
    scope: "ssGSEA, GSVA, z-score, AUCell and UCell on 8 pseudobulked case-control datasets (5 tissues, 682 donors) and simulations, against 5 criteria"
    categories: [low-cell-stats, qc-benchmarks]
    verified: true
    notes: "Research Square preprint. Rank-based AUCell and UCell lost or inverted signal under high competitor burden; no method met all five criteria. No record is a method it evaluated (see signature-scoring-evidence)"

  - id: ahlmann-eltze-2025-perturbation-benchmark
    name: Ahlmann-Eltze et al. 2025, deep perturbation models versus linear baselines
    doi: 10.1038/s41592-025-02772-6
    pmid: "40759747"
    cite_title: Deep-learning-based gene perturbation effect prediction does not yet outperform simple linear baselines
    year: 2025
    scope: "scGPT, scFoundation, UCE, scBERT, Geneformer, GEARS and CPA against no-change, additive and linear baselines on double and unseen single genetic perturbations"
    categories: [perturbation-models]
    verified: true
    notes: "No deep model beat the baselines; CPA was particularly uncompetitive on double perturbations and was left out of the unseen-perturbation task. Evaluates: cpa"

  - id: csendes-2025-foundation-models
    name: Csendes et al. 2025, foundation models for perturbation prediction
    doi: 10.1186/s12864-025-11600-2
    pmid: "40269681"
    cite_title: Benchmarking foundation cell models for post-perturbation RNA-seq prediction
    year: 2025
    scope: "scGPT and scFoundation against a train-mean baseline and simple feature-based models on the Adamson, Norman and two Replogle Perturb-seq datasets"
    categories: [perturbation-models]
    verified: true
    notes: "The train-mean baseline beat both foundation models; the benchmark datasets have low perturbation-specific variance. No record is a method it evaluated"

  - id: wong-2025-perturbation-controls
    name: Wong et al. 2025, simple controls for perturbation prediction
    doi: 10.1093/bioinformatics/btaf317
    pmid: "40407144"
    cite_title: Simple controls exceed best deep learning algorithms and reveal foundation model effectiveness for predicting genetic perturbations
    year: 2025
    scope: "A simple baseline against GEARS, transformer foundation models and simpler neural architectures on the Adamson (corrected), Norman and Replogle K562 Perturb-seq datasets"
    categories: [perturbation-models]
    verified: true
    notes: "The simple baseline outperformed the deep models. No record is a method it evaluated"

  - id: miller-2026-calibrated-metrics
    name: Miller et al. 2026, calibrated metrics for perturbation models
    doi: 10.1038/s41587-026-03307-w
    pmid: "42823510"
    cite_title: Deep learning perturbation models can outperform baselines on calibrated metrics
    year: 2026
    scope: "Deep genetic-perturbation models against uninformative and positive-control baselines across 14 datasets and 18 metrics"
    categories: [perturbation-models]
    verified: true
    notes: "Abstract only (no open full text): common metrics such as MSE and Pearson delta are often miscalibrated, and on calibrated metrics deep models can beat uninformative baselines. Models compared not checked, so no record is linked"

  - id: li-2026-perturbation-models
    name: Li et al. 2026, single-cell perturbation response models
    doi: 10.1126/sciadv.aed3414
    pmid: "42715312"
    cite_title: A systematic comparison of single-cell perturbation response prediction models
    year: 2026
    scope: "13 models (scGPT, scFoundation, GEARS, scELMo, PerturbNet, scGen, trVAE, scVIDR, scPRAM, CPA, BioLord and others) and baselines across 25 datasets, including two primary immune-cell drug-response sets, in three tasks"
    categories: [perturbation-models]
    verified: true
